/* ================= 行情資料 hook ================= */
function useMarketData() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(false);
  useEffect(() => {
    fetch(`./data/market-data.json?t=${Date.now()}`)
      .then(r => r.json())
      .then(setData)
      .catch(() => setError(true));
  }, []);
  return { data, error };
}

/* ================= Hero ================= */
function HeroMedia() {
  const [v, setV] = useState(undefined);   // undefined=讀取中, null=沒有影片

  useEffect(() => {
    fetch(`./data/videos.json?t=${Date.now()}`)
      .then(r => r.json())
      .then(d => {
        const list = (d.videos || []).filter(x => !x.hidden);
        /* 優先用指定的首頁影片，沒指定就用最新一支 */
        const pick = d.heroVideoId
          ? list.find(x => x.videoId === d.heroVideoId)
          : list[0];
        setV(pick || null);
      })
      .catch(() => setV(null));
  }, []);

  /* 還沒有影片時，維持原本的空拍照 */
  if (!v) {
    return <img src="assets/area-01-artmuseum.jpg" alt="高雄美術館特區空拍"
      className="w-full aspect-[3/2] object-cover rounded-sm" />;
  }

  return (
    <div className="relative w-full aspect-[3/2] rounded-sm overflow-hidden bg-ink">
      <iframe
        className="absolute inset-0 w-full h-full"
        src={`https://www.youtube-nocookie.com/embed/${v.videoId}?autoplay=1&mute=1&loop=1&playlist=${v.videoId}&controls=0&modestbranding=1&playsinline=1&rel=0&disablekb=1`}
        title={v.titleShown || v.title}
        loading="lazy"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerPolicy="strict-origin-when-cross-origin" />
      {/* 擋住 iframe 的點擊，避免誤觸 YouTube 介面；想看完整影片走下方連結 */}
      <a href="videos/index.html" aria-label="前往影片專區"
        className="absolute inset-0 block" />
    </div>
  );
}

/* 簽名元素：四區共用刻度的成交價格帶 */
function PriceBand({ area, domain }) {
  if (!area.bandLow || !area.bandHigh || !domain) {
    return <div className="h-9 flex items-center font-mono text-[12px] text-inkFaint">成交資料不足</div>;
  }
  const span = domain.max - domain.min || 1;
  const left = ((area.bandLow - domain.min) / span) * 100;
  const width = ((area.bandHigh - area.bandLow) / span) * 100;
  const avgPos = ((area.avgPricePerPing - domain.min) / span) * 100;

  return (
    <div className="h-9 pt-3">
      <div className="relative h-[3px] bg-line rounded-sm">
        <div className="absolute h-[3px] bg-orange/35 rounded-sm"
          style={{ left: `${left}%`, width: `${width}%` }} />
        <div className="absolute w-[3px] h-[11px] bg-ink -top-[4px] rounded-sm"
          style={{ left: `calc(${Math.min(Math.max(avgPos, 0), 100)}% - 1.5px)` }} />
      </div>
      <div className="font-mono text-[12px] text-inkSoft mt-2">
        成交帶 {area.bandLow}–{area.bandHigh} 萬
      </div>
    </div>
  );
}

function AreasSection({ market, error }) {
  const areas = market?.areas ?? [];
  const bands = areas.filter(a => a.bandLow && a.bandHigh);
  const domain = bands.length
    ? { min: Math.min(...bands.map(a => a.bandLow)), max: Math.max(...bands.map(a => a.bandHigh)) }
    : null;

  return (
    <section id="areas" className="max-w-6xl mx-auto px-6 py-20">
      <SectionHead
        label="Market Data"
        title="四個主力生活圈，現在的行情"

      />

      <div className="grid sm:grid-cols-2 gap-6">
        {areas.map(a => {
          const meta = AREA_META[a.code] || {};
          return (
            <article key={a.code}
              className="flex flex-col border border-line rounded-sm bg-surface overflow-hidden">
              <img src={meta.img} alt={a.name}
                className="w-full aspect-[3/2] object-cover shrink-0" />
              <div className="flex flex-col flex-1 p-7">
                <div className="font-mono text-[12px] tracking-wider text-inkFaint">{meta.district}</div>
                <h3 className="text-xl font-bold mt-1 mb-2.5 tracking-tight">{a.name}</h3>
                <p className="text-[15px] text-inkSoft leading-[1.85]">{meta.desc}</p>

                <div className="mt-auto pt-5">
                  <div className="font-mono text-[30px] font-semibold text-ink leading-none">
                    {a.avgPricePerPing ?? "—"}
                    <span className="text-[13px] font-normal text-inkSoft ml-1">萬/坪</span>
                  </div>

                  <PriceBand area={a} domain={domain} />

                  )}
                </div>
              </div>
            </article>
          );
        })}
      </div>

      {domain && (
        <div className="mt-8 pt-4 border-t border-line flex justify-between font-mono text-[12px] text-inkFaint">
          <span>{domain.min} 萬/坪</span>
          <span>四區共用刻度｜直線為該區均價</span>
          <span>{domain.max} 萬/坪</span>
        </div>
      )}

      <p className="mt-4 font-mono text-[12px] text-inkFaint">
        {error && "資料讀取失敗，請稍後再試"}
        {!error && market && (market.updatedAt
          ? `資料更新於 ${new Date(market.updatedAt).toLocaleDateString("zh-TW")}・來源：內政部不動產交易實價查詢服務網`
          : "尚未執行首次自動更新，目前為示意資料")}
        {!error && !market && "讀取中…"}
      </p>
    </section>
  );
}

              </div>
              <h3 className="text-[22px] font-bold mt-3 mb-3 tracking-tight">{t.title}</h3>
              <p className="text-[16px] text-inkSoft leading-[1.9]">{t.desc}</p>

              {Illus && (
                <div className="flex-1 min-h-[130px] flex items-center justify-center py-6">
                  <div className="w-full max-w-[260px]"><Illus /></div>
                </div>
              )}

              <span className={`font-mono text-[13px] ${Illus ? "" : "mt-auto pt-6"} ${t.href ? "text-orangeDeep" : "text-inkFaint"}`}>
                {t.href ? "開始使用 →" : "即將上線"}
              </span>
            </>
          );
          const cls = "sm:aspect-square flex flex-col border border-line rounded-sm bg-surface p-8";
          return t.href
            ? <a key={i} href={t.href} className={`${cls} hover:bg-tint hover:border-orange transition`}>{inner}</a>
            : <div key={i} className={cls}>{inner}</div>;
        })}
      </div>
    </section>
  );
}

function FaqSection() {
  const [open, setOpen] = useState(0);

  useEffect(() => {
    let el = document.getElementById("ld-home-faq");
    if (!el) { el = document.createElement("script"); el.id = "ld-home-faq"; el.type = "application/ld+json"; document.head.appendChild(el); }
    el.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "FAQPage",
      mainEntity: FAQS.map(([q, a]) => ({
        "@type": "Question",
        name: q,
        acceptedAnswer: { "@type": "Answer", text: a },
      })),
    });
  }, []);

  return (
    <section id="faq" className="max-w-6xl mx-auto px-6 py-20">
      <SectionHead
        label="FAQ"
        title="常見問題"
        note="買方與屋主最常問的十個問題。找不到答案的，直接來電問我們最快。"
      />
      <div className="border-t border-line">
        {FAQS.map(([q, a], i) => (
          <div key={i} className="border-b border-line">
            <button
              onClick={() => setOpen(open === i ? -1 : i)}
              aria-expanded={open === i}
              className="w-full flex items-start justify-between gap-6 py-6 text-left group">
              <h3 className="text-[17px] md:text-[18px] font-bold leading-snug tracking-tight group-hover:text-orangeDeep transition">
                {q}

              <span className={`font-mono text-[20px] text-orangeDeep shrink-0 leading-none mt-1 transition-transform ${open === i ? "rotate-45" : ""}`}>

              </span>
            </button>
            {open === i && (
              <p className="text-[16px] text-inkSoft leading-[2] pb-7 pr-12 max-w-4xl">{a}</p>

          </div>
        ))}

    </section>
  );
}
