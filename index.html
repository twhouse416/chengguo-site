<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<style>
  body { background: #FBF8F3; }
  .citrus-divider { display: flex; justify-content: center; margin: 0; }
  ::selection { background: #FFE8D1; color: #3A2E27; }
</style>
</head>
<body class="font-body text-ink">

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ---------- 簽名視覺：柑橘切片分隔線 ---------- */
function CitrusDivider() {
  return (
    <div className="citrus-divider py-10">
      <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
        <circle cx="36" cy="36" r="34" stroke="#FD7305" strokeWidth="2" fill="#FFE8D1" />
        <circle cx="36" cy="36" r="26" stroke="#FD7305" strokeWidth="1.5" fill="none" />
        {[0,45,90,135].map((deg,i) => (
          <line key={i} x1="36" y1="36"
            x2={36 + 26*Math.cos(deg*Math.PI/180)}
            y2={36 + 26*Math.sin(deg*Math.PI/180)}
            stroke="#FD7305" strokeWidth="1.5" />
        ))}
        <circle cx="36" cy="36" r="4" fill="#FD7305" />
      </svg>
    </div>
  );
}

/* ---------- Eyebrow 標籤 ---------- */
function Eyebrow({ code, children }) {
  return (
    <div className="flex items-center gap-3 mb-4">
      <span className="font-mono text-xs tracking-widest text-orangeDark bg-peach px-2 py-1 rounded-full">{code}</span>
      <span className="font-mono text-xs tracking-widest text-sage uppercase">{children}</span>
    </div>
  );
}

function CTAButton({ children, primary = true, href = "#" }) {
  return (
    <a href={href}
      className={`inline-flex items-center gap-2 px-6 py-3 rounded-full font-heading font-bold text-sm transition
        ${primary
          ? "bg-orange text-white hover:bg-orangeDark shadow-lg shadow-orange/20"
          : "bg-white text-ink border border-ink/10 hover:border-orange"}`}>
      {children}
    </a>
  );
}

/* ---------- 品牌資料（統一在這裡維護） ---------- */
const BRAND = {
  teamName: "台灣房屋 澄果團隊",
  legalName: "澄果資產有限公司",
  address: "804 高雄市鼓山區青海路416號",
  phone: "07-9766977",
  phoneHref: "tel:0797669977", // 07-9766977
  officialSite: "https://store.twhg.com.tw/TE80",
  facebook: "https://www.facebook.com/TWhouseo8",
  instagram: "https://www.instagram.com/twhouse_o8",
};

/* ---------- Header ---------- */
function Header() {
  const [open, setOpen] = useState(false);
  const nav = [
    ["#areas", "四大生活圈"],
    ["#about", "關於澄果"],
    ["#services", "首購・換屋"],
    ["#knowledge", "知識文章"],
    ["#tools", "試算工具"],
  ];
  return (
    <header className="sticky top-0 z-50 bg-cream/90 backdrop-blur border-b border-ink/5">
      <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <a href="#" className="flex items-center gap-2 font-heading font-900 text-base md:text-lg text-orangeDark">
          <img src="assets/logo-icon.png" alt="澄果團隊 Logo" className="w-9 h-9 rounded-full object-cover shrink-0" />
          <span className="leading-tight">
            <span className="block text-xs font-normal text-ink/50">台灣房屋</span>
            澄果團隊
          </span>
        </a>
        <nav className="hidden md:flex items-center gap-6 font-medium text-sm text-ink/80">
          {nav.map(([href, label]) => (
            <a key={href} href={href} className="hover:text-orangeDark transition">{label}</a>
          ))}
        </nav>
        <div className="hidden md:flex items-center gap-4">
          <a href={BRAND.phoneHref} className="font-mono text-sm text-ink/70 hover:text-orangeDark">{BRAND.phone}</a>
          <CTAButton href={BRAND.officialSite}>線上諮詢</CTAButton>
        </div>
        <button className="md:hidden text-2xl" onClick={() => setOpen(!open)}>☰</button>
      </div>
      {open && (
        <div className="md:hidden px-6 pb-4 flex flex-col gap-3 bg-cream border-t border-ink/5">
          {nav.map(([href, label]) => (
            <a key={href} href={href} className="py-1" onClick={() => setOpen(false)}>{label}</a>
          ))}
          <a href={BRAND.phoneHref} className="font-mono text-sm text-ink/70">{BRAND.phone}</a>
          <CTAButton href={BRAND.officialSite}>線上諮詢</CTAButton>
        </div>
      )}
    </header>
  );
}

/* ---------- Hero ---------- */
function Hero() {
  return (
    <section className="max-w-6xl mx-auto px-6 pt-16 pb-8 grid md:grid-cols-2 gap-10 items-center">
      <div>
        <Eyebrow code="CG·HOME">在地生活圈房仲</Eyebrow>
        <h1 className="font-heading font-900 text-4xl md:text-5xl leading-tight text-ink">
          美術館・農十六<br/>瑞豐巨蛋・中都<br/>
          <span className="text-orange">你的第一個家，</span>我們慢慢找
        </h1>
        <p className="mt-6 text-base md:text-lg text-ink/70 leading-relaxed">
          澄果團隊專注首購與換屋家庭，用清楚的行情數據和貼心陪伴，
          陪你在熟悉的生活圈裡，找到住得久、住得安心的家。
        </p>
        <div className="mt-8 flex flex-wrap gap-4">
          <CTAButton href={BRAND.officialSite}>線上諮詢</CTAButton>
          <CTAButton primary={false} href="#areas">看四大生活圈行情</CTAButton>
        </div>
      </div>
      <div className="relative">
        <div className="aspect-[4/3] rounded-3xl overflow-hidden">
          <img src="assets/area-01-artmuseum.jpg" alt="高雄美術館特區空拍" className="w-full h-full object-cover" />
        </div>
        <div className="absolute -bottom-4 -left-4 bg-white rounded-2xl shadow-lg px-5 py-4 font-mono text-xs">
          <div className="text-sage">美術館特區・大樓均價</div>
          <div className="text-2xl text-ink font-bold">40.4 <span className="text-sm font-normal">萬/坪</span></div>
        </div>
      </div>
    </section>

/* ---------- 四大生活圈：說明文字、照片（固定），行情數字（動態抓取） ---------- */
const AREA_DESC = {
  "01": "公園綠帶、學區優良，家庭客首選生活圈",
  "02": "重劃區新成屋多，機能完整、停車方便",
  "03": "商圈生活機能強，交通樞紐、通勤族愛",
  "04": "愛河景觀、濕地公園，新興換屋熱區",
};
const AREA_IMG = {
  "01": "assets/area-01-artmuseum.jpg",
  "02": "assets/area-02-nong16.jpg",
  "03": "assets/area-03-ruifeng.jpg",
  "04": "assets/area-04-zhongdu.jpg",
};

function AreasSection() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(false);

  React.useEffect(() => {
    fetch("./data/market-data.json")
      .then(res => res.json())
      .then(setData)
      .catch(() => setError(true));
  }, []);

  return (
    <section id="areas" className="max-w-6xl mx-auto px-6 py-10">
      <Eyebrow code="CG·01">四大主力生活圈</Eyebrow>
      <h2 className="font-heading font-900 text-2xl md:text-3xl mb-2">澄果團隊主攻的家，都在這四區</h2>
      <p className="text-ink/60 mb-2 text-sm">
        近 6 個月大樓成交每坪均價與走勢
      </p>
      <p className="text-ink/40 mb-8 text-xs font-mono">
        {error && "資料讀取失敗，顯示為暫時性錯誤"}
        {!error && data && (data.updatedAt ? `資料更新於 ${new Date(data.updatedAt).toLocaleString("zh-TW")}` : "尚未執行首次自動抓取，以下為示意資料")}
        {!error && !data && "讀取中…"}
      </p>
      <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-5">
        {(data ? data.areas : []).map(a => (
          <div key={a.code} className="bg-white rounded-2xl overflow-hidden border border-ink/5 hover:border-orange/40 transition">
            <img src={AREA_IMG[a.code]} alt={a.name} className="w-full aspect-[4/3] object-cover" />
            <div className="p-6">
              <span className="font-mono text-xs text-sage">CG·{a.code}</span>
              <h3 className="font-heading font-bold text-lg mt-2 mb-2">{a.name}</h3>
              <p className="text-sm text-ink/60 leading-relaxed mb-4">{AREA_DESC[a.code]}</p>
              <div className="flex items-end justify-between font-mono">
                <span className="text-2xl font-bold text-orangeDark">
                  {a.avgPricePerPing ?? "—"}<span className="text-xs text-ink/50 font-normal">萬/坪</span>
                </span>
                <span className="text-sm text-sage">
                  {a.trendPct == null ? "—" : `${a.trendPct > 0 ? "▲" : "▼"} ${Math.abs(a.trendPct)}%`}
                </span>
              </div>
              {a.lowSample && (
                <p className="text-[11px] text-orangeDark/70 mt-2">樣本數偏少，僅供參考</p>
              )}
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}

/* ---------- 得獎紀錄清單 ---------- */
const AWARDS = [
  "104年度評鑑優質", "104年度第2季團隊績效第3名",
  "106年度評鑑優質",
  "107年度評鑑優質", "107年度第1季團隊績效第2名", "107年度上半季戰力精進第1名",

      <div className="md:col-span-2">

        <h2 className="font-heading font-900 text-2xl md:text-3xl mb-4">陪首購族與換屋家庭，一起把日子過安穩</h2>
        <ul className="space-y-2 text-ink/70 text-sm leading-relaxed">

          </summary>
          <ul className="mt-3 grid sm:grid-cols-2 gap-x-6 gap-y-1 text-xs text-ink/60 font-mono">
            {AWARDS.map((a, i) => <li key={i}>・ {a}</li>)}

        <div className="mt-6">
          <CTAButton href={BRAND.officialSite}>線上諮詢澄果團隊</CTAButton>

/* ---------- 首購／換屋服務 ---------- */

    <section id="services" className="max-w-6xl mx-auto px-6 py-10">

      <div className="grid md:grid-cols-2 gap-6">
        {cards.map((c,i) => (

      <h2 className="font-heading font-900 text-2xl md:text-3xl mb-8">買房前，先把該懂的事搞懂</h2>
      <div className="grid md:grid-cols-3 gap-6">
        {ARTICLES.map((a,i) => (

            <h3 className="font-heading font-bold mt-2 mb-2 leading-snug">{a.title}</h3>

  { code: "T-04", title: "房地合一稅試算", desc: "換屋賣舊屋前，先算清楚要繳多少稅。" },

function ToolsSection() {

    <section id="tools" className="max-w-6xl mx-auto px-6 py-10">

/* ---------- 聯絡／Footer ---------- */

function App() {

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
