<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="../../assets/logo-icon.png" />
<title>學區查詢｜台灣房屋 澄果團隊</title>
<meta name="description" content="查詢高雄鼓山區、左營區、三民區各里對應的國民小學學區，資料依高雄市115學年度國民小學學區劃分一覽表。" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:'#16191D', inkSoft:'#474D55', inkFaint:'#737A83',
          paper:'#F4F4F2', surface:'#FFFFFF', line:'#DEDCD7',
          orange:'#FD7305', orangeDeep:'#B85400', tint:'#FCEFE3',
        },
        fontFamily: {
          sans: ['"Noto Sans TC"','sans-serif'],
          mono: ['"IBM Plex Mono"','monospace'],
        },
        borderRadius: { DEFAULT:'3px', sm:'2px', md:'4px' },
      }
    }
  }
</script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  body { background:#F4F4F2; -webkit-font-smoothing:antialiased; }
  ::selection { background:#FD7305; color:#fff; }
  .display { font-weight:900; letter-spacing:-0.02em; line-height:1.25; }
  :focus-visible { outline:2px solid #FD7305; outline-offset:2px; }
  mark { background:#FCEFE3; color:#B85400; padding:0 2px; }
</style>
</head>
<body class="font-sans text-ink">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const BRAND = {
  officialSite: "https://store.twhg.com.tw/TE80",
  phone: "07-9766977",
  phoneHref: "tel:0797669977",
};

/* 從官方學區原文抽出里名：里名前必須是分隔符或字串開頭 */
function extractVillages(zone) {
  const out = [];
  const re = /(^|[^\u4e00-\u9fff])([\u4e00-\u9fff]{2,3}里)/g;
  let m;
  while ((m = re.exec(zone)) !== null) {
    if (!out.includes(m[2])) out.push(m[2]);
  }
  return out;
}

/* 把符合的里名在原文中標起來 */
function Highlight({ text, term }) {
  if (!term) return <>{text}</>;
  const parts = text.split(term);
  return (
    <>
      {parts.map((p, i) => (
        <React.Fragment key={i}>
          {p}
          {i < parts.length - 1 && <mark>{term}</mark>}
        </React.Fragment>
      ))}
    </>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(false);
  const [district, setDistrict] = useState("");
  const [village, setVillage] = useState("");

  useEffect(() => {
    fetch("../../data/school-zones.json")
      .then(r => r.json())
      .then(setData)
      .catch(() => setError(true));
  }, []);

  const districts = useMemo(() => {
    if (!data) return [];
    return [...new Set(data.entries.map(e => e.zoneDistrict))];
  }, [data]);

  const villages = useMemo(() => {
    if (!data || !district) return [];
    const set = new Set();
    data.entries
      .filter(e => e.zoneDistrict === district)
      .forEach(e => extractVillages(e.zone).forEach(v => set.add(v)));
    return [...set].sort((a, b) => a.localeCompare(b, "zh-Hant"));
  }, [data, district]);

  const results = useMemo(() => {
    if (!data || !district || !village) return [];
    return data.entries.filter(
      e => e.zoneDistrict === district && e.zone.includes(village)
    );
  }, [data, district, village]);

  return (
    <div>
      {/* Header */}
      <header className="sticky top-0 z-50 bg-paper/95 backdrop-blur-sm border-b border-line">
        <div className="max-w-4xl mx-auto px-6 h-[68px] flex items-center justify-between">
          <a href="../../index.html" className="flex items-center gap-3">
            <img src="../../assets/logo-icon.png" alt="" className="w-9 h-9 object-contain" />
            <span className="leading-tight">
              <span className="block font-mono text-[11px] tracking-[0.2em] text-inkFaint">TAIWAN REALTY</span>
              <span className="block text-[17px] font-bold tracking-tight">澄果團隊</span>
            </span>
          </a>
          <a href="../../index.html#tools" className="text-[15px] text-inkSoft hover:text-ink">← 回工具列表</a>
        </div>
      </header>

      <main className="max-w-4xl mx-auto px-6 py-14">
        <div className="font-mono text-[12px] tracking-[0.18em] text-orangeDeep uppercase mb-3">Tool 01</div>
        <h1 className="display text-[30px] md:text-[36px]">學區查詢</h1>
        <p className="mt-4 text-[16px] text-inkSoft leading-[1.9] max-w-2xl">
          選擇行政區與里別，查出對應的國民小學學區。
          目前收錄澄果團隊主力生活圈所在的鼓山區、左營區、三民區。
        </p>
        <div className="mt-6 h-px bg-line" />

        {/* 查詢區 */}
        <div className="mt-8 bg-surface border border-line rounded-sm p-7">
          <div className="grid sm:grid-cols-2 gap-6">
            <label className="block">
              <span className="block font-mono text-[12px] tracking-wider text-inkFaint mb-2">行政區</span>
              <select
                className="w-full border border-line rounded-sm px-4 py-3 text-[16px] bg-surface"
                value={district}
                onChange={e => { setDistrict(e.target.value); setVillage(""); }}>
                <option value="">請選擇</option>
                {districts.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </label>

            <label className="block">
              <span className="block font-mono text-[12px] tracking-wider text-inkFaint mb-2">
                里別{district && `（${villages.length} 個）`}
              </span>
              <select
                className="w-full border border-line rounded-sm px-4 py-3 text-[16px] bg-surface disabled:bg-paper disabled:text-inkFaint"
                value={village}
                disabled={!district}
                onChange={e => setVillage(e.target.value)}>
                <option value="">{district ? "請選擇" : "請先選行政區"}</option>
                {villages.map(v => <option key={v} value={v}>{v}</option>)}
              </select>
            </label>
          </div>

          {error && (
            <p className="mt-6 text-[15px] text-orangeDeep">學區資料讀取失敗，請重新整理頁面再試一次。</p>
          )}
          {!error && !data && (
            <p className="mt-6 font-mono text-[13px] text-inkFaint">讀取學區資料中…</p>
          )}
        </div>

        {/* 結果 */}
        {village && (
          <section className="mt-10">
            <h2 className="display text-[20px] mb-1">
              {district}{village}　對應學區
            </h2>
            <p className="text-[15px] text-inkSoft mb-6">
              共 {results.length} 筆。請對照原文確認你的「鄰」別是否落在範圍內。
            </p>

            <div className="space-y-4">
              {results.map((r, i) => (
                <article key={i} className="bg-surface border border-line rounded-sm p-6">
                  <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-3">
                    <h3 className="text-[19px] font-bold tracking-tight">{r.school}</h3>
                    {r.schoolDistrict !== district && (
                      <span className="font-mono text-[12px] text-orangeDeep border border-orange/40 rounded-sm px-2 py-0.5">
                        校址位於 {r.schoolDistrict}
                      </span>
                    )}
                  </div>
                  <div className="font-mono text-[12px] tracking-wider text-inkFaint mb-2">官方學區原文</div>
                  <p className="text-[15px] leading-[1.95] text-inkSoft">
                    <Highlight text={r.zone} term={village} />
                  </p>
                </article>
              ))}
            </div>

            {results.length > 1 && (
              <p className="mt-5 text-[15px] text-inkSoft leading-[1.9]">
                查到多筆，通常代表這個里被切分成不同鄰、分屬不同學校，或屬於「自由學區」可自行選擇。
                請依原文的鄰別範圍判斷，不確定時建議直接向學校或區公所確認。
              </p>
            )}
          </section>
        )}

        {/* 使用說明與免責 */}
        <section className="mt-14 border-t border-line pt-8">
          <h2 className="font-mono text-[12px] tracking-[0.18em] text-orangeDeep uppercase mb-4">Notes</h2>
          <ul className="space-y-3 text-[15px] text-inkSoft leading-[1.9]">
            <li>・ 資料依據{data ? `${data.sourceName}` : "高雄市國民小學學區劃分一覽表"}，逐字轉錄，未經改寫。</li>
            <li>・ 學區以「里」與「鄰」劃分，同一個里可能分屬不同學校。本工具只能查到里，鄰別請自行對照原文。</li>
            <li>・「自由學區」表示該範圍可在兩所學校之間選擇。</li>
            <li>・「總量管制學校」名額有限，即使設籍在學區內仍可能需要抽籤或改分發，務必先向學校確認。</li>
            <li>・ 目前僅收錄國民小學，且僅涵蓋鼓山區、左營區、三民區。國中學區與其他行政區尚未上線。</li>
            <li>・ 學區每學年可能調整，本頁資料僅供參考，正式依據請以教育局及各校公告為準。</li>
          </ul>
          {data && (
            <a href={data.sourceUrl} target="_blank" rel="noopener noreferrer"
              className="inline-block mt-5 font-mono text-[13px] text-orangeDeep hover:underline">
              查看官方原始文件（PDF）→
            </a>
          )}
        </section>

        {/* CTA */}
        <section className="mt-12 bg-ink text-white/75 rounded-sm p-8">
          <h2 className="display text-[20px] text-white">想知道某個社區實際讀哪間學校？</h2>
          <p className="mt-3 text-[16px] leading-[1.9] max-w-xl">
            學區牽涉到鄰別與設籍時間，社區跨鄰的狀況也不少。
            把你在看的物件地址給我們，澄果團隊直接幫你查清楚。
          </p>
          <div className="mt-6 flex flex-wrap gap-3">
            <a href={BRAND.officialSite} target="_blank" rel="noopener noreferrer"
              className="inline-flex items-center px-7 py-3.5 text-[15px] font-medium rounded-sm bg-orange text-white hover:bg-orangeDeep transition">
              線上諮詢
            </a>
            <a href={BRAND.phoneHref}
              className="inline-flex items-center px-7 py-3.5 text-[15px] font-medium rounded-sm border border-white/30 text-white hover:bg-white hover:text-ink transition">
              致電 {BRAND.phone}
            </a>
          </div>
        </section>
      </main>

      <footer className="border-t border-line">
        <div className="max-w-4xl mx-auto px-6 py-8 font-mono text-[12px] text-inkFaint flex flex-wrap gap-x-6 gap-y-2 justify-between">
          <span>© {new Date().getFullYear()} 澄果資產有限公司</span>
          <a href="../../index.html" className="hover:text-orangeDeep">回首頁</a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
