<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="../assets/logo-icon.png" />
<title>知識文章｜台灣房屋 澄果團隊</title>
<meta name="description" content="首購與換屋最常卡住的問題整理：新青安3.0、自備款、房地合一稅、重購退稅，以及高雄四大生活圈的在地觀察。" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { ink:'#16191D', inkSoft:'#474D55', inkFaint:'#737A83',
        paper:'#F4F4F2', surface:'#FFFFFF', line:'#DEDCD7',
        orange:'#FD7305', orangeDeep:'#B85400', tint:'#FCEFE3' },
      fontFamily: { sans:['"Noto Sans TC"','sans-serif'], mono:['"IBM Plex Mono"','monospace'] },
      borderRadius: { DEFAULT:'3px', sm:'2px', md:'4px' },
    }}
  }
</script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  body { background:#F4F4F2; -webkit-font-smoothing:antialiased; }
  ::selection { background:#FD7305; color:#fff; }
  .display { font-weight:900; letter-spacing:-0.02em; line-height:1.25; }
  :focus-visible { outline:2px solid #FD7305; outline-offset:2px; }
</style>
</head>
<body class="font-sans text-ink">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const BRAND = {
  phone: "07-9766977",
  phoneHref: "tel:0797669977",
  facebook: "https://www.facebook.com/TWhouseo8",
  instagram: "https://www.instagram.com/twhouse_o8",
};

function fmtDate(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,"0")}.${String(dt.getDate()).padStart(2,"0")}`;
}

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(false);
  const [tag, setTag] = useState("全部");

  useEffect(() => {
    fetch("../data/articles.json")
      .then(r => r.json())
      .then(setData)
      .catch(() => setError(true));
  }, []);

  const published = useMemo(
    () => (data?.articles ?? []).filter(a => !a.draft),
    [data]
  );

  const tags = useMemo(
    () => ["全部", ...new Set(published.map(a => a.tag))],
    [published]
  );

  const list = tag === "全部" ? published : published.filter(a => a.tag === tag);

  return (
    <div>
      <header className="sticky top-0 z-50 bg-paper/95 backdrop-blur-sm border-b border-line">
        <div className="max-w-5xl mx-auto px-6 h-[68px] flex items-center justify-between">
          <a href="../index.html" className="flex items-center gap-3">
            <img src="../assets/logo-icon.png" alt="" className="w-9 h-9 object-contain" />
            <span className="leading-tight">
              <span className="block font-mono text-[11px] tracking-[0.2em] text-inkFaint">TAIWAN REALTY</span>
              <span className="block text-[17px] font-bold tracking-tight">澄果團隊</span>
            </span>
          </a>
          <a href={BRAND.phoneHref}
            className="inline-flex items-center px-6 py-3 text-[15px] font-medium rounded-sm bg-orange text-white hover:bg-orangeDeep transition">
            來電諮詢 {BRAND.phone}
          </a>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-6 py-14">
        <div className="font-mono text-[12px] tracking-[0.18em] text-orangeDeep uppercase mb-3">Notes</div>
        <h1 className="display text-[30px] md:text-[36px]">知識文章</h1>
        <p className="mt-4 text-[16px] text-inkSoft leading-[1.9] max-w-2xl">
          首購與換屋最常卡住的幾個問題，我們整理成好讀的說明。
          內容會隨法規與市場變動更新，發布日期標在每篇文章上。
        </p>
        <div className="mt-6 h-px bg-line" />

        {error && (
          <p className="mt-10 text-[16px] text-orangeDeep">文章資料讀取失敗，請重新整理頁面再試一次。</p>
        )}
        {!error && !data && (
          <p className="mt-10 font-mono text-[13px] text-inkFaint">讀取中…</p>
        )}

        {data && published.length === 0 && (
          <div className="mt-10 border border-line rounded-sm bg-surface p-8">
            <p className="text-[16px] text-inkSoft leading-[1.9]">
              文章正在準備中，近期陸續發布。
              如果有想先了解的問題，歡迎直接來電，我們可以直接回答你。
            </p>
            <a href={BRAND.phoneHref}
              className="inline-flex items-center mt-6 px-7 py-3.5 text-[15px] font-medium rounded-sm bg-orange text-white hover:bg-orangeDeep transition">
              來電諮詢 {BRAND.phone}
            </a>
          </div>
        )}

        {published.length > 0 && (
          <>
            <div className="flex flex-wrap gap-2 mt-8">
              {tags.map(t => (
                <button key={t} onClick={() => setTag(t)}
                  className={`px-4 py-2 text-[14px] rounded-sm border transition ${
                    tag === t
                      ? "bg-ink text-white border-ink"
                      : "bg-surface text-inkSoft border-line hover:border-ink"
                  }`}>
                  {t}
                </button>
              ))}
            </div>

            <div className="mt-10 grid md:grid-cols-2 gap-x-8 gap-y-10">
              {list.map(a => (
                <article key={a.slug} className="border-t-2 border-ink pt-5">
                  {a.cover && (
                    <a href={`article.html?slug=${a.slug}`} className="block mb-4">
                      <img src={`../${a.cover}`} alt={a.coverAlt || a.title} loading="lazy"
                        className="w-full aspect-[3/2] object-contain bg-paper rounded-sm border border-line" />
                    </a>
                  )}
                  <div className="flex items-center gap-3 mb-3 font-mono text-[12px]">
                    <span className="text-orangeDeep tracking-wider">{a.tag}</span>
                    <span className="text-inkFaint">{fmtDate(a.date)}</span>
                    {a.readMinutes && <span className="text-inkFaint">約 {a.readMinutes} 分鐘</span>}
                  </div>
                  <h2 className="text-[19px] font-bold leading-snug mb-3 tracking-tight">
                    <a href={`article.html?slug=${a.slug}`} className="hover:text-orangeDeep transition">
                      {a.title}
                    </a>
                  </h2>
                  <p className="text-[15px] text-inkSoft leading-[1.9]">{a.summary}</p>
                  <a href={`article.html?slug=${a.slug}`}
                    className="inline-block mt-4 font-mono text-[13px] text-orangeDeep hover:underline">
                    閱讀全文 →
                  </a>
                </article>
              ))}
            </div>
          </>
        )}
      </main>

      <footer className="border-t border-line mt-10">
        <div className="max-w-5xl mx-auto px-6 py-8 font-mono text-[12px] text-inkFaint flex flex-wrap gap-x-6 gap-y-2 justify-between">
          <span>© {new Date().getFullYear()} 澄果資產有限公司</span>
          <a href="../index.html" className="hover:text-orangeDeep">回首頁</a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
