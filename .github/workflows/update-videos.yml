name: 同步 YouTube 影片

on:
  schedule:
    # 每 6 小時檢查一次頻道有沒有新影片
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 讀取頻道 RSS 並更新清單
        run: node scripts/fetch-youtube.js

      - name: 重新建置全站
        run: node scripts/build-site.js

      - name: 有變動就提交
        run: |
          git config user.name "chengguo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json index.html notes videos tools communities sitemap.xml
          git diff --cached --quiet && echo "影片清單無變動" || git commit -m "同步 YouTube 影片 $(date +'%Y-%m-%d %H:%M')"
          git push
