name: 同步 YouTube 影片

on:
  schedule:
    # 每 6 小時檢查一次頻道有沒有新影片
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 讀取頻道 RSS 並更新清單
        run: node scripts/fetch-youtube.js

      - name: 重新建置全站
        run: node scripts/build-site.js

      - name: 有變動就提交
        run: |
          git config user.name "chengguo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json index.html notes videos tools communities sitemap.xml
          git diff --cached --quiet && echo "影片清單無變動" || git commit -m "同步 YouTube 影片 $(date +'%Y-%m-%d %H:%M')"
          # GitHub 偶爾會回 5xx，重試幾次避免整批工作白費
          for i in 1 2 3 4 5; do
            if git push; then echo "推送成功"; break; fi
            if [ $i -eq 5 ]; then echo "::error::推送失敗 5 次"; exit 1; fi
            echo "推送失敗，$((i*15)) 秒後重試（第 $i 次）"
            sleep $((i*15))
            git pull --rebase --autostash || true
          done