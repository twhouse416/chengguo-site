name: 同步 YouTube 影片

on:
  schedule:
    # 每 6 小時檢查一次頻道有沒有新影片
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 讀取頻道 RSS 並更新清單
        run: node scripts/fetch-youtube.js

      - name: 重新建置全站
        run: node scripts/build-site.js

      - name: 編譯 Tailwind CSS
        # 掃描剛產生的 HTML，把用到的 class 編成 assets/tailwind.css。
        # 一定要在 build-site.js 之後跑，否則掃到的是上一版的 HTML。
        run: |
          npm ci --no-audit --no-fund
          npm run css

      - name: 有變動就提交
        # 提交與推送統一交給 scripts/git-push-retry.sh：
        # 兩個流程同時跑而被擋下來時，它會以遠端最新為底重做這一筆，
        # 不做合併，所以不會像舊寫法那樣卡在未合併狀態一路失敗到底。
        run: |
          bash scripts/git-push-retry.sh "同步 YouTube 影片 $(date +'%Y-%m-%d %H:%M')" \
            data/videos.json assets/videos index.html notes videos tools communities sitemap.xml assets/tailwind.css
