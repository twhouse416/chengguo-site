name: 每月檢查文章時效

on:
  schedule:
    # 每月 1 日台灣時間早上 9:00（UTC 前一日 01:00）
    - cron: "0 1 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 檢查文章時效
        id: check
        run: node scripts/check-articles.js

      - name: 有待處理項目就開 issue
        if: steps.check.outputs.has_items == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.BODY;
            const title = `文章檢視提醒 ${new Date().toISOString().slice(0,7)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
        env:
          BODY: ${{ steps.check.outputs.body }}
