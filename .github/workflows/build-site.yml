name: 全站靜態建置

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安裝建置相依套件
        # 必須在 build-site.js 之前：工具頁的 JSX 由 @babel/core 在建置時編譯，
        # 沒先裝好的話會退回瀏覽器端編譯（頁面仍可用，但會多載一個很大的腳本）。
        run: npm ci --no-audit --no-fund

      - name: 產生全站靜態頁
        run: node scripts/build-site.js

      - name: 編譯 Tailwind CSS
        # 掃描剛產生的 HTML，把用到的 class 編成 assets/tailwind.css。
        # 一定要在 build-site.js 之後跑，否則掃到的是上一版的 HTML。
        run: npm run css

      - name: 有變動就提交
        # 提交與推送統一交給 scripts/git-push-retry.sh：
        # 兩個流程同時跑而被擋下來時，它會以遠端最新為底重做這一筆，
        # 不做合併，所以不會像舊寫法那樣卡在未合併狀態一路失敗到底。
        run: |
          bash scripts/git-push-retry.sh "全站重新建置 $(date +'%Y-%m-%d %H:%M')" \
            index.html 404.html about notes videos tools communities areas developers schools deals sitemap.xml robots.txt llms.txt assets/tailwind.css
