name: 回補社區歷史成交

# 手動觸發專用。每日的行情更新只抓最近四季，
# 較早的成交（例如已完銷的預售案）要用這支回補。
on:
  workflow_dispatch:
    inputs:
      periods:
        description: "要回補幾期？（1 期 = 1 季，14 期約 3.5 年）"
        required: true
        default: "14"
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 回補社區歷史成交
        run: node scripts/backfill-community-deals.js ${{ inputs.periods }}

      # 回補要跑十幾分鐘，先把結果存成可下載的檔案，
      # 萬一後面推送失敗也不必整批重跑
      - name: 保存回補結果
        uses: actions/upload-artifact@v4
        with:
          name: community-deals
          path: data/community-deals.json
          retention-days: 7

      - name: 重新建置全站
        run: node scripts/build-site.js

      - name: 編譯 Tailwind CSS
        # 掃描剛產生的 HTML，把用到的 class 編成 assets/tailwind.css。
        # 一定要在 build-site.js 之後跑，否則掃到的是上一版的 HTML。
        run: |
          npm ci --no-audit --no-fund
          npm run css

      - name: 提交結果
        # 提交與推送統一交給 scripts/git-push-retry.sh：
        # 兩個流程同時跑而被擋下來時，它會以遠端最新為底重做這一筆，
        # 不做合併，所以不會像舊寫法那樣卡在未合併狀態一路失敗到底。
        run: |
          bash scripts/git-push-retry.sh "回補社區歷史成交 $(date +'%Y-%m-%d %H:%M')" \
            data/community-deals.json index.html notes videos tools communities sitemap.xml assets/tailwind.css
