name: 產生文章靜態頁

on:
  push:
    branches: [main]
    paths:
      - "data/articles.json"
      - "scripts/build-articles.js"
      - "scripts/build-sitemap.js"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 產生文章靜態頁
        run: node scripts/build-articles.js

      - name: 更新 sitemap
        run: node scripts/build-sitemap.js

      - name: 有變動就提交
        run: |
          git config user.name "chengguo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notes/*.html sitemap.xml
          git diff --cached --quiet && echo "無變動" || git commit -m "更新文章靜態頁 $(date +'%Y-%m-%d %H:%M')"
          git push
