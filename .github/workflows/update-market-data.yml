name: 更新四大生活圈行情（每月 2、12、22 日）

# 內政部實價登錄每月 1、11、21 日公告新資料（每 10 天一批），
# 其餘日子跑出來的結果完全一樣，所以排程只在公告後隔天執行。
on:
  schedule:
    # 台灣時間 2、12、22 日早上 7:00（UTC 為前一日 23:00，即 1、11、21 日）
    - cron: "0 23 1,11,21 * *"
    # 備援：若上面那次下載失敗，隔天早上 7:00 再自動跑一次。
    # 資料沒變動就不會提交，不會產生多餘的紀錄。
    - cron: "0 23 2,12,22 * *"
  workflow_dispatch: {} # 也可以手動在 GitHub 網頁上按「Run workflow」立即執行一次

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 執行抓取與計算
        id: fetch
        # 下載失敗時腳本會中止且不寫入任何檔案，
        # 這裡標記為失敗但不中斷流程，後續步驟仍會用既有資料重新建置。
        continue-on-error: true
        run: node scripts/fetch-market-data.js

      - name: 抓取失敗時提示
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::實價登錄下載不完整，本次未更新行情資料。網站維持既有內容，稍後會由排程自動重試。"

      - name: 重新建置全站
        run: node scripts/build-site.js

      - name: 編譯 Tailwind CSS
        # 掃描剛產生的 HTML，把用到的 class 編成 assets/tailwind.css。
        # 一定要在 build-site.js 之後跑，否則掃到的是上一版的 HTML。
        run: |
          npm ci --no-audit --no-fund
          npm run css

      - name: 若資料有變動，提交回儲存庫
        run: |
          git config user.name "chengguo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-data.json data/community-deals.json index.html notes videos tools communities sitemap.xml assets/tailwind.css
          git diff --cached --quiet && echo "沒有變動，略過提交" || git commit -m "更新行情與社區資料 $(date +'%Y-%m-%d %H:%M')"
          # GitHub 偶爾會回 5xx，重試幾次避免整批工作白費
          for i in 1 2 3 4 5; do
            if git push; then echo "推送成功"; break; fi
            if [ $i -eq 5 ]; then echo "::error::推送失敗 5 次"; exit 1; fi
            echo "推送失敗，$((i*15)) 秒後重試（第 $i 次）"
            sleep $((i*15))
            git pull --rebase --autostash || true
          done