name: 回補生活圈成交資料池

# 手動觸發專用。把內政部拿得到的所有批次下載回來，
# 落在四大生活圈範圍內的全部存進 data/area-deals/。
#
# 會抓三種來源：季檔 N 期（長期歷史）、非本期批次七期（季檔還沒收錄的那一段）、
# 本期十天檔。其中「非本期批次」正是原本資料會缺一塊的原因——
# 那幾批公告過期就從十天檔下架，而涵蓋它們的季檔還沒發布。
#
# 跑完之後，社區頁的成交是從這個池子撈出來的，
# 以後新增社區或修改門牌範圍都不必再向內政部重抓——
# 因為內政部的十天檔只留最近一批，過期就再也拿不回來。
#
# 20 期（五年）大約要跑 25～40 分鐘，主要時間花在下載。
on:
  workflow_dispatch:
    inputs:
      periods:
        description: "回補幾季？（20 = 五年。填 0 表示只抓非本期與本期，很快）"
        required: true
        default: "20"
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 回補資料池
        run: node scripts/backfill-area-pool.js ${{ inputs.periods }}

      # 回補要跑很久，先存成可下載的檔案，
      # 萬一後面推送失敗也不必整批重跑
      - name: 保存資料池
        uses: actions/upload-artifact@v4
        with:
          name: area-deals
          path: data/area-deals/
          retention-days: 7

      - name: 提交結果
        # 提交與推送統一交給 scripts/git-push-retry.sh：
        # 兩個流程同時跑而被擋下來時，它會以遠端最新為底重做這一筆，
        # 不做合併，所以不會像舊寫法那樣卡在未合併狀態一路失敗到底。
        run: |
          bash scripts/git-push-retry.sh "回補生活圈成交資料池 $(date +'%Y-%m-%d %H:%M')" \
            data/area-deals

      - name: 下一步提醒
        run: |
          echo "::notice::資料池已更新。接著跑一次「更新四大生活圈行情」，社區頁才會反映新資料。"
