/* ---------- 工具 ---------- */
const todayStr = () => new Date().toISOString().slice(0, 10);

function addMonths(dateStr, m) {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + m);
  return d.toISOString().slice(0, 10);
}

function slugify(title) {
  return title.trim().toLowerCase()
    .replace(/[^\w\u4e00-\u9fff]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 60) || `article-${Date.now()}`;
}

/* UTF-8 安全的 base64（GitHub API 需要） */
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

/* 上傳前先在瀏覽器壓縮，避免圖片太大拖慢網站 */
function compressImage(file, maxW = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(b => b ? resolve({ blob: b, w, h }) : reject(new Error("壓縮失敗")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("這個檔案不是有效的圖片")); };
    img.src = url;
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function safeFileName(name) {
  const base = name.replace(/\.[^.]+$/, "")
    .toLowerCase()
    .replace(/[^a-z0-9\u4e00-\u9fff]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 40) || "image";
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g, "");
  return `${stamp}-${base}-${Math.random().toString(36).slice(2,6)}.jpg`;
}

/* 把貼進來的長文自動拆成區塊：
   【標題】或「一、」開頭 → 小標；短行且以冒號結尾 → 小標；其餘為段落 */
/* 貼上的長文通常夾雜平台介面文字，先清掉再解析 */
const NOISE = [
  /^發[佈布]時間[：:]/, /^更新時間[：:]/, /^閱讀時間[：:]/,
  /^瀏覽(次數|人次)?[：:]?\s*\d/, /^分享$/, /^留言$/, /^收藏$/, /^追蹤$/,
  /^複製連結$/, /^上一篇/, /^下一篇/, /^相關文章$/, /^延伸閱讀$/,
  /^\d+\s*(則留言|人追蹤|次瀏覽)/, /^R\.?TUBE/i, /^Copyright/i, /^©/,
];
const isNoise = line => NOISE.some(re => re.test(line));

/* 平台的按鈕文字常擠在同一行（例如「分享 留言 收藏」），先切開再濾 */
const INLINE_NOISE = ["分享", "留言", "收藏", "追蹤", "按讚", "複製連結", "檢舉"];
function stripInlineNoise(line) {
  const parts = line.split(/[\s|｜·・]+/).filter(Boolean);
  if (parts.length >= 2 && parts.every(t => INLINE_NOISE.includes(t))) return "";
  return line;
}

/* 把貼上的長文拆成標題、摘要、內文區塊、FAQ、關鍵字 */
function parseLongText(raw, opts = {}) {
  const lines = String(raw || "")
    .replace(/\r/g, "")
    .split(/\n+/)
    .map(l => l.trim())
    .map(stripInlineNoise)
    .filter(Boolean)
    .filter(l => !isNoise(l));

  /* 抽出 hashtag 當關鍵字，並從內文移除那幾行 */
  const keywords = [];
  const body = [];
  lines.forEach(line => {
    const tags = line.match(/#[\u4e00-\u9fff\w]{2,20}/g);
    if (tags && tags.join("").length > line.length * 0.5) {
      /* 整行幾乎都是 hashtag，視為標籤行 */
      tags.forEach(t => { const k = t.slice(1); if (!keywords.includes(k)) keywords.push(k); });
      return;
    }
    if (tags) tags.forEach(t => { const k = t.slice(1); if (!keywords.includes(k)) keywords.push(k); });
    body.push(line.replace(/#[\u4e00-\u9fff\w]{2,20}/g, "").trim());
  });
  const clean = body.filter(Boolean);

  /* 第一行若像標題（夠短、沒有句號結尾），拿來當標題 */
  let title = "";
  let startIdx = 0;
  if (opts.detectTitle && clean.length) {
    const first = clean[0];
    if (first.length <= 45 && !/[。]$/.test(first)) {
      title = first.replace(/^【(.+?)】$/, "$1");
      startIdx = 1;
    }
  }

  const blocks = [];
  const faq = [];
  let buffer = [];
  let pendingQ = null;

  const flush = () => {
    if (buffer.length) { blocks.push({ type: "p", text: buffer.join("\n") }); buffer = []; }
  };

  for (let i = startIdx; i < clean.length; i++) {
    const line = clean[i];

    /* Q：問題 / A：回答 → 收進 FAQ */
    const q = line.match(/^Q\s*[：:.\d]*\s*(.+)$/i);
    const a = line.match(/^A\s*[：:.\d]*\s*(.+)$/i);
    if (q && q[1].length > 4) { flush(); pendingQ = q[1].trim(); continue; }
    if (a && pendingQ) { faq.push([pendingQ, a[1].trim()]); pendingQ = null; continue; }
    if (pendingQ && !a) {
      /* 問題的下一行就是答案（沒寫 A：） */
      faq.push([pendingQ, line]); pendingQ = null; continue;
    }

    const bracket = line.match(/^【(.+?)】\s*(.*)$/);
    const numbered = /^[一二三四五六七八九十]+[、.]/.test(line) && line.length < 30;
    const shortHead = line.length < 24 && /[:：]$/.test(line);
    const markdownH = line.match(/^#{2,4}\s*(.+)$/);

    if (bracket) {
      flush();
      blocks.push({ type: "h", text: bracket[1].trim() });
      if (bracket[2]) buffer.push(bracket[2].trim());
    } else if (markdownH) {
      flush();
      blocks.push({ type: "h", text: markdownH[1].trim() });
    } else if (numbered || shortHead) {
      flush();
      blocks.push({ type: "h", text: line.replace(/[:：]$/, "") });
    } else if (/^[-－・･•‧●◆▍✓✔]\s*/.test(line)) {
      const last = blocks[blocks.length - 1];
      const item = line.replace(/^[-－・･•‧●◆▍✓✔]\s*/, "");
      if (buffer.length) flush();
      if (last && last.type === "list") last.items.push(item);
      else blocks.push({ type: "list", items: [item] });
    } else if (/^\d+[.、)]\s*/.test(line) && line.length < 60) {
      const last = blocks[blocks.length - 1];
      const item = line.replace(/^\d+[.、)]\s*/, "");
      if (buffer.length) flush();
      if (last && last.type === "list") last.items.push(item);
      else blocks.push({ type: "list", items: [item] });
    } else {
      buffer.push(line);
    }
  }
  flush();

  /* 摘要：取第一個夠長的段落，前 90 字 */
  const firstP = blocks.find(b => b.type === "p" && b.text.replace(/\n/g, "").length > 20);
  const summary = firstP ? firstP.text.replace(/\n/g, "").slice(0, 90) : "";

  return {
    title,
    summary,
    keywords: keywords.slice(0, 10),
    faq,
    blocks: blocks.length ? blocks : [{ type: "p", text: raw }],
  };
}

/* ---- 自動備份：發布或下載前先存一份到瀏覽器，最多保留 10 份 ---- */
const BACKUP_KEY = "cg_article_backups";

function loadBackups() {
  try { return JSON.parse(localStorage.getItem(BACKUP_KEY) || "[]"); }
  catch { return []; }
}

function saveBackup(data, note) {
  try {
    const list = loadBackups();
    list.unshift({
      at: new Date().toISOString(),
      note,
      count: (data.articles || []).length,
      published: (data.articles || []).filter(a => !a.draft).length,
      json: JSON.stringify(data),
    });
    localStorage.setItem(BACKUP_KEY, JSON.stringify(list.slice(0, 10)));
    return true;
  } catch { return false; }
}

function fmtStamp(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function emptyBlock(type) {
  switch (type) {
    case "table": return { type, head: ["項目", "說明"], rows: [["", ""]] };
    case "list":  return { type, items: [""] };
    case "image": return { type, src: "", alt: "", caption: "" };
    default:      return { type, text: "" };
  }
}

function newArticle() {
  const d = todayStr();
  return {
    slug: "", tag: "首購", title: "", summary: "",
    date: d, updated: d, reviewBy: addMonths(d, 6),
    readMinutes: 5, draft: true,
    keywords: [], faq: [], sources: [],
    blocks: [{ type: "p", text: "" }],
  };
}

/* ---------- 小元件 ---------- */
function Label({ children, hint }) {
  return (
    <div className="mb-2">
      <span className="font-mono text-[12px] tracking-wider text-inkFaint">{children}</span>
      {hint && <span className="block text-[12px] text-inkFaint mt-0.5 leading-relaxed">{hint}</span>}
    </div>
  );
}

const inputCls = "w-full border border-line rounded-sm px-4 py-2.5 text-[15px] bg-surface focus:border-orange outline-none";

function Btn({ children, onClick, variant = "solid", size = "md", disabled, title }) {
  const sizes = size === "sm" ? "px-3 py-1.5 text-[13px]" : "px-6 py-3 text-[15px]";
  const styles = {
    solid: "bg-orange text-white hover:bg-orangeDeep disabled:bg-line disabled:text-inkFaint",
    outline: "border border-line text-inkSoft hover:border-ink hover:text-ink",
    danger: "border border-fail/40 text-fail hover:bg-fail hover:text-white",
    dark: "bg-ink text-white hover:bg-black",
  };
  return (
    <button onClick={onClick} disabled={disabled} title={title}
      className={`inline-flex items-center justify-center font-medium rounded-sm transition ${sizes} ${styles[variant]}`}>
      {children}
    </button>
  );
}

/* ---------- 圖片選擇／上傳 ---------- */
function ImagePicker({ src, onPick, uploader, label = "圖片" }) {
  const ref = useRef(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const handle = async e => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    setErr(""); setBusy(true);
    try {
      const path = await uploader(f);
      onPick(path);
    } catch (ex) {
      setErr(ex.message || String(ex));
    } finally { setBusy(false); }
  };

  return (
    <div>
      <Label>{label}</Label>
      {src ? (
        <div className="flex gap-3 items-start">
          <img src={`../${src}`} alt="" className="w-32 aspect-[3/2] object-contain bg-paper rounded-sm border border-line shrink-0"
            onError={e => { e.target.style.opacity = 0.25; }} />
          <div className="flex-1 min-w-0">
            <div className="font-mono text-[12px] text-inkFaint break-all mb-2">{src}</div>
            <div className="flex gap-2">
              <Btn size="sm" variant="outline" onClick={() => ref.current.click()} disabled={busy}>
                {busy ? "上傳中…" : "換一張"}
              </Btn>
              <Btn size="sm" variant="outline" onClick={() => onPick("")}>移除</Btn>
            </div>
          </div>
        </div>
      ) : (
        <div>
          <Btn size="sm" variant="outline" onClick={() => ref.current.click()} disabled={busy}>
            {busy ? "上傳中…" : "＋ 選擇圖片"}
          </Btn>
          <p className="text-[12px] text-inkFaint mt-2 leading-relaxed">
            會自動縮到寬 1600px 並壓縮，避免拖慢網站。
          </p>
        </div>
      )}
      <input ref={ref} type="file" accept="image/*" className="hidden" onChange={handle} />
      {err && <p className="text-[13px] text-fail mt-2 leading-relaxed">{err}</p>}
      <input className={inputCls + " mt-3"} value={src || ""} placeholder="或直接填路徑：assets/articles/xxx.jpg"
        onChange={e => onPick(e.target.value)} />
    </div>
  );
}

/* ---------- 區塊編輯器 ---------- */
function BlockEditor({ block, onChange, onRemove, onMove, isFirst, isLast, uploader }) {
  const meta = BLOCK_TYPES.find(b => b.type === block.type);

  const set = patch => onChange({ ...block, ...patch });

  return (
    <div className="border border-line rounded-sm bg-surface">
      <div className="flex items-center justify-between px-4 py-2.5 border-b border-line bg-paper">
        <div className="flex items-center gap-3">
          <span className="font-mono text-[12px] tracking-wider text-orangeDeep">{meta?.label}</span>
          {(block.showFrom || block.showUntil) && (
            <span className="font-mono text-[11px] text-inkFaint">
              {block.showFrom && `${block.showFrom} 起`}
              {block.showUntil && `${block.showUntil} 前`}
            </span>
          )}
        </div>
        <div className="flex items-center gap-1.5">
          <Btn size="sm" variant="outline" onClick={() => onMove(-1)} disabled={isFirst} title="上移">↑</Btn>
          <Btn size="sm" variant="outline" onClick={() => onMove(1)} disabled={isLast} title="下移">↓</Btn>
          <Btn size="sm" variant="danger" onClick={onRemove} title="刪除">刪除</Btn>
        </div>
      </div>

      <div className="p-4 space-y-3">
        {(block.type === "h" || block.type === "p" || block.type === "note" || block.type === "quote") && (
          <textarea rows={block.type === "h" || block.type === "quote" ? 2 : 4}
            className={inputCls}
            placeholder={
              block.type === "h" ? "小標題文字" :
              block.type === "quote" ? "想強調的一句話" :
              block.type === "note" ? "提醒或警語，會顯示成橘色框" :
              "段落內容。換行會自動分段。想強調的字用 **兩個星號** 包起來會變粗體。"}
            value={block.text || ""}
            onChange={e => set({ text: e.target.value })} />
        )}

        {block.type === "list" && (
          <div className="space-y-2">
            {(block.items || []).map((it, i) => (
              <div key={i} className="flex gap-2">
                <span className="font-mono text-[12px] text-inkFaint pt-3 w-6 shrink-0">{String(i+1).padStart(2,"0")}</span>
                <textarea rows={2} className={inputCls} value={it}
                  placeholder="條列項目"
                  onChange={e => {
                    const items = [...block.items]; items[i] = e.target.value; set({ items });
                  }} />
                <Btn size="sm" variant="outline"
                  onClick={() => set({ items: block.items.filter((_, j) => j !== i) })}>✕</Btn>
              </div>
            ))}
            <Btn size="sm" variant="outline" onClick={() => set({ items: [...(block.items||[]), ""] })}>
              ＋ 新增一項
            </Btn>
          </div>
        )}

        {block.type === "table" && (
          <div className="space-y-3">
            <div>
              <Label>欄位名稱</Label>
              <div className="flex gap-2">
                {block.head.map((h, i) => (
                  <input key={i} className={inputCls} value={h}
                    onChange={e => { const head=[...block.head]; head[i]=e.target.value; set({head}); }} />
                ))}
                <Btn size="sm" variant="outline"
                  onClick={() => set({ head: [...block.head, ""], rows: block.rows.map(r => [...r, ""]) })}>＋欄</Btn>
                {block.head.length > 2 && (
                  <Btn size="sm" variant="outline"
                    onClick={() => set({ head: block.head.slice(0,-1), rows: block.rows.map(r => r.slice(0,-1)) })}>−欄</Btn>
                )}
              </div>
            </div>
            <div>
              <Label>資料列</Label>
              <div className="space-y-2">
                {block.rows.map((row, ri) => (
                  <div key={ri} className="flex gap-2">
                    {row.map((cell, ci) => (
                      <input key={ci} className={inputCls} value={cell}
                        onChange={e => {
                          const rows = block.rows.map(r => [...r]);
                          rows[ri][ci] = e.target.value; set({ rows });
                        }} />
                    ))}
                    <Btn size="sm" variant="outline"
                      onClick={() => set({ rows: block.rows.filter((_, j) => j !== ri) })}>✕</Btn>
                  </div>
                ))}
              </div>
              <div className="mt-2">
                <Btn size="sm" variant="outline"
                  onClick={() => set({ rows: [...block.rows, block.head.map(() => "")] })}>＋ 新增一列</Btn>
              </div>
            </div>
          </div>
        )}

        {block.type === "image" && (
          <div className="space-y-4">
            <ImagePicker src={block.src} uploader={uploader}
              onPick={v => set({ src: v })} label="插圖" />
            <div>
              <Label hint="給看不到圖片的人與搜尋引擎看的描述">替代文字</Label>
              <input className={inputCls} value={block.alt || ""}
                placeholder="例如：農十六特區空拍"
                onChange={e => set({ alt: e.target.value })} />
            </div>
            <div>
              <Label hint="顯示在圖片下方，可留空">圖說</Label>
              <input className={inputCls} value={block.caption || ""}
                placeholder="例如：農十六特區：街廓方正、道路寬闊（空拍模擬圖）"
                onChange={e => set({ caption: e.target.value })} />
            </div>
          </div>
        )}

        <details className="pt-1">
          <summary className="cursor-pointer font-mono text-[12px] text-inkFaint select-none">
            排程顯示（選填）
          </summary>
          <div className="grid sm:grid-cols-2 gap-3 mt-3">
            <div>
              <Label hint="這個日期起才顯示">起始日</Label>
              <input type="date" className={inputCls} value={block.showFrom || ""}
                onChange={e => set({ showFrom: e.target.value || undefined })} />
            </div>
            <div>
              <Label hint="這個日期起就隱藏">結束日</Label>
              <input type="date" className={inputCls} value={block.showUntil || ""}
                onChange={e => set({ showUntil: e.target.value || undefined })} />
            </div>
          </div>
          <p className="text-[12px] text-inkFaint mt-2 leading-relaxed">
            用來做「時間到自動換句話」。例如寫兩段話，一段設結束日、一段設起始日為同一天，
            那天一到網站就會自動切換。
          </p>
        </details>
      </div>
    </div>
  );
}

/* ---------- 預覽 ---------- */
function PreviewBlock({ block }) {
  const rich = t => {
    const parts = String(t || "").split(/(\*\*[^*]+\*\*)/g);
    return parts.map((p, i) =>
      p.startsWith("**") && p.endsWith("**")
        ? <strong key={i} className="font-bold text-ink">{p.slice(2,-2)}</strong>
        : <React.Fragment key={i}>{p}</React.Fragment>);
  };

  switch (block.type) {
    case "h": return <h2 className="display text-[19px] mt-10 mb-5 pt-6 border-t border-line">{block.text}</h2>;
    case "p": {
      const paras = String(block.text||"").split(/\n\s*\n|\n/).map(t=>t.trim()).filter(Boolean);
      return (
        <div className="mb-6">
          {paras.map((t,i) => (
            <p key={i} className="text-[15px] leading-[2] text-inkSoft mb-4 last:mb-0">{rich(t)}</p>
          ))}
        </div>
      );
    }
    case "list": return (
      <ul className="mb-5 space-y-2">
        {(block.items||[]).map((it,i) => (
          <li key={i} className="flex gap-2.5 text-[15px] leading-[1.9] text-inkSoft">
            <span className="font-mono text-[12px] text-orangeDeep pt-1 shrink-0">{String(i+1).padStart(2,"0")}</span>
            <span>{rich(it)}</span>
          </li>
        ))}
      </ul>
    );
    case "table": return (
      <div className="mb-5 overflow-x-auto">
        <table className="w-full text-[14px] border border-line bg-surface">
          <thead><tr className="border-b border-line bg-paper">
            {block.head.map((h,i) => (
              <th key={i} className={`font-mono text-[12px] text-inkFaint font-normal py-2.5 px-3 ${i===0?"text-left":"text-right"}`}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {block.rows.map((r,i) => (
              <tr key={i} className="border-b border-line last:border-0">
                {r.map((c,j) => (
                  <td key={j} className={`py-2.5 px-3 ${j===0?"text-ink":"text-right text-inkSoft"}`}>{rich(c)}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
    case "note": return (
      <div className="mb-5 bg-tint border-l-2 border-orange px-5 py-4">
        <p className="text-[14px] leading-[1.9] text-orangeDeep">{rich(block.text)}</p>
      </div>
    );
    case "quote": return (
      <blockquote className="my-7 py-5 border-y-2 border-ink">
        <p className="display text-[17px] leading-[1.6]">{block.text}</p>
      </blockquote>
    );
    case "image": return block.src ? (
      <figure className="my-6">
        <img src={`../${block.src}`} alt={block.alt||""} className="w-full h-auto rounded-sm border border-line bg-paper" />
        {block.caption && <figcaption className="mt-2 text-[13px] text-inkFaint">{block.caption}</figcaption>}
      </figure>
    ) : (
      <div className="my-6 aspect-[3/2] border border-dashed border-line rounded-sm flex items-center justify-center font-mono text-[12px] text-inkFaint">
        尚未選擇圖片
      </div>
    );
    default: return null;
  }
}

/* ---------- 主程式 ---------- */
function App() {

  const [bulkText, setBulkText] = useState("");
  const [backups, setBackups] = useState([]);
  const [baseSha, setBaseSha] = useState(null);   // 載入時線上版本的識別碼
  const [tab, setTab] = useState("articles");     // articles | videos
  const [vdata, setVdata] = useState(null);
  const [vSha, setVSha] = useState(null);
  const [vBusy, setVBusy] = useState(false);
  const [bdata, setBdata] = useState(null);
  const [bBusy, setBBusy] = useState(false);
  const [cdata, setCdata] = useState(null);

  const [cIdx, setCIdx] = useState(null);          // 正在編輯第幾個社區
  const [cDraft, setCDraft] = useState(null);      // 編輯中的社區
  const [cDeals, setCDeals] = useState(null);      // 成交筆數（唯讀，供參考）
  const cFileRef = useRef(null);
  const [ddata, setDdata] = useState(null);
  const [dBusy, setDBusy] = useState(false);
  const [showBackups, setShowBackups] = useState(false);
  const fileRef = useRef(null);

  /* 載入資料：有權杖時直接從 GitHub API 取（可拿到版本識別碼 sha，且一定是最新的） */
  const loadData = async (tk, rp) => {
    if (tk && rp) {
      try {
        const res = await fetch(`https://api.github.com/repos/${rp}/contents/${DATA_PATH}`, {
          headers: { Authorization: `Bearer ${tk}`, Accept: "application/vnd.github+json" },
          cache: "no-store",
        });
        if (res.ok) {
          const j = await res.json();
          const raw = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))));
          const d = JSON.parse(raw);
          setData(d); setBaseSha(j.sha);
          saveBackup(d, "開啟後台時的線上版本");
          setBackups(loadBackups());
          return;
        }
      } catch { /* 失敗就退回一般讀取 */ }
    }
    try {
      const r = await fetch(`../data/articles.json?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      setData(d); setBaseSha(null);
      saveBackup(d, "開啟後台時的線上版本");
      setBackups(loadBackups());
    } catch (e) { setLoadErr(String(e)); }
  };

  /* 影片資料：有權杖時從 GitHub 讀（可取得 sha），否則讀網站上的檔案 */
  const loadVideos = async (tk, rp) => {
    if (tk && rp) {
      try {
        const res = await fetch(`https://api.github.com/repos/${rp}/contents/${VIDEO_PATH}`, {
          headers: { Authorization: `Bearer ${tk}`, Accept: "application/vnd.github+json" },
          cache: "no-store",
        });
        if (res.ok) {
          const j = await res.json();
          const raw = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))));
          setVdata(JSON.parse(raw)); setVSha(j.sha);
          return;
        }
      } catch {}
    }
    try {
      const r = await fetch(`../data/videos.json?t=${Date.now()}`, { cache: "no-store" });

  const loadBuyers = async (tk, rp) => {
    if (tk && rp) {
      try {
        const res = await fetch(`https://api.github.com/repos/${rp}/contents/${BUYER_PATH}`, {
          headers: { Authorization: `Bearer ${tk}`, Accept: "application/vnd.github+json" },
          cache: "no-store",
        });
        if (res.ok) {

          const raw = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))));

          return;
        }
      } catch {}
    }

      const r = await fetch(`../data/buyers.json?t=${Date.now()}`, { cache: "no-store" });

    } catch {}
  };

  const loadCommunities = async (tk, rp) => {
    if (tk && rp) {
      try {
        const res = await fetch(`https://api.github.com/repos/${rp}/contents/${COMMUNITY_PATH}`, {
          headers: { Authorization: `Bearer ${tk}`, Accept: "application/vnd.github+json" },
          cache: "no-store",
        });
        if (res.ok) {
          const j = await res.json();
          setCdata(JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))))));
          return;
        }
      } catch {}
    }
    try {
      const r = await fetch(`../data/communities.json?t=${Date.now()}`, { cache: "no-store" });
      if (r.ok) setCdata(await r.json());
    } catch {}
  };

  /* 成交筆數只是顯示參考，讀不到也不影響編輯 */
  const loadCommunityDeals = async () => {
    try {

  const flash = (type, text) => { setMsg({ type, text }); setTimeout(() => setMsg(null), 6000); };

  const startNew = () => { setDraft(newArticle()); setIdx(-1); };
  const startEdit = i => { setDraft(JSON.parse(JSON.stringify(data.articles[i]))); setIdx(i); };

  const saveToList = () => {
    if (!draftArticle.title.trim()) { flash("fail", "標題不能空白"); return; }

    if (!a.slug.trim()) a.slug = slugify(a.title);

    const articles = [...data.articles];
    if (idx === -1) {
      if (articles.some(x => x.slug === a.slug)) { flash("fail", "這個網址代號已經有人用了，請改一個"); return; }
      articles.unshift(a);
    } else {
      articles[idx] = a;
    }
    setData({ ...data, articles });
    setDraft(null); setIdx(null);
    flash("pass", idx === -1 ? "已加入列表，記得按下方「發布」或「下載」才會真的更新網站" : "已更新，記得發布或下載");
  };

  const removeArticle = i => {
    if (!confirm(`確定要刪除「${data.articles[i].title}」？`)) return;
    setData({ ...data, articles: data.articles.filter((_, j) => j !== i) });
    flash("pass", "已從列表移除，記得發布或下載才會生效");
  };

  const toggleDraft = i => {
    const articles = [...data.articles];
    articles[i] = { ...articles[i], draft: !articles[i].draft };
    setData({ ...data, articles });
  };

  const jsonText = () => JSON.stringify(data, null, 2) + "\n";

  const download = () => {
    saveBackup(data, "下載前");
    setBackups(loadBackups());
    const blob = new Blob([jsonText()], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "articles.json"; a.click();
    URL.revokeObjectURL(url);
    flash("pass", "已下載 articles.json，請上傳到 GitHub 的 data 資料夾覆蓋原檔");
  };

  const copyJson = async () => {
    try { await navigator.clipboard.writeText(jsonText()); flash("pass", "已複製，可貼到 GitHub 上覆蓋 data/articles.json"); }
    catch { flash("fail", "複製失敗，請改用下載"); }
  };

  const importFile = e => {
    const f = e.target.files?.[0]; if (!f) return;
    e.target.value = "";
    const r = new FileReader();
    r.onload = () => {
      let d;
      try { d = JSON.parse(r.result); if (!Array.isArray(d.articles)) throw 0; }
      catch { flash("fail", "這個檔案格式不對"); return; }

      const incoming = d.articles;
      const existing = data?.articles || [];
      const sameSlugs = incoming.filter(a => existing.some(x => x.slug === a.slug)).length;
      const newOnes = incoming.length - sameSlugs;

      const merge = confirm(
        `檔案裡有 ${incoming.length} 篇文章。\n` +
        `其中 ${sameSlugs} 篇與現有文章同名、${newOnes} 篇是新的。\n\n` +
        `按「確定」＝合併（同名者以檔案內容更新，其餘現有文章保留不動）\n` +
        `按「取消」＝改用取代全部（現有文章會全部被檔案內容取代）`
      );

      saveBackup(data, "匯入檔案前");
      setBackups(loadBackups());

      if (merge) {
        const map = new Map(existing.map(a => [a.slug, a]));
        incoming.forEach(a => map.set(a.slug, a));
        setData({ ...data, articles: [...map.values()] });
        flash("pass", `已合併：更新 ${sameSlugs} 篇、新增 ${newOnes} 篇。記得按發布或下載才會生效。`);
      } else {
        if (!confirm("確定要用檔案內容取代目前全部文章嗎？")) { flash("fail", "已取消"); return; }
        setData(d);
        flash("pass", "已取代全部文章。記得按發布或下載才會生效。");
      }
    };
    r.readAsText(f);
  };

  /* 上傳圖片到 repo 的 assets/articles/，回傳網站根目錄起算的路徑 */
  const uploadImage = async file => {
    if (!token.trim()) {
      throw new Error("要上傳圖片需要先在「發布設定」填入 GitHub 權杖。或是自行把圖片放到 assets/articles/ 後，在下方欄位填路徑。");
    }
    const { blob, w, h } = await compressImage(file);
    const name = safeFileName(file.name);

      const err = await res.json().catch(() => ({}));

    }
    flash("pass", `圖片已上傳（${w}×${h}，${Math.round(blob.size / 1024)} KB）`);
    return filePath;

  const publishCommunities = async () => {

  };

  const newCommunity = () => ({
    slug: "", name: "", aliases: [], district: "鼓山區", area: "美術館特區", areaCode: "01",

    specs: [["建設公司", ""], ["總戶數", ""], ["樓層規劃", ""], ["坪數範圍", ""],
            ["格局", ""], ["公設比", ""], ["車位", ""], ["基地面積", ""]],
    highlights: [], considerations: [],

    faq: [],

      const existing = cdata?.communities || [];

      setCdata({ ...(cdata || {}), ...d, communities: [...map.values()] });
      flash("pass", `已合併：更新 ${updated} 個、新增 ${added} 個。記得按「儲存並發布」。`);
    };
    r.readAsText(f);

  const publishBuyers = async () => {

      const cur = await getRes.json();
      const body = JSON.stringify(bdata, null, 2) + "\n";
      const putRes = await fetch(api, {
        method: "PUT", headers: { ...headers, "Content-Type": "application/json" },
        body: JSON.stringify({ message: `更新買方需求 ${todayStr()}`, content: toBase64(body), sha: cur.sha }),
      });
      if (!putRes.ok) {
        const err = await putRes.json().catch(() => ({}));
        throw new Error(`儲存失敗（${putRes.status}）${err.message ? "：" + err.message : ""}`);
      }
      flash("pass", "買方需求已儲存，網站約 1–2 分鐘後更新。");
    } catch (e) { flash("fail", e.message || String(e)); }
    finally { setBBusy(false); }
  };

  const publishVideos = async () => {
    if (!token.trim()) { flash("fail", "要儲存影片設定需要先填入 GitHub 權杖"); return; }
    setVBusy(true);
    try {
      const api = `https://api.github.com/repos/${repo.trim()}/contents/${VIDEO_PATH}`;
      const headers = { Authorization: `Bearer ${token.trim()}`, Accept: "application/vnd.github+json" };
      const getRes = await fetch(api, { headers, cache: "no-store" });
      if (!getRes.ok) throw new Error(`讀取失敗（${getRes.status}）`);
      const cur = await getRes.json();

      const body = JSON.stringify(vdata, null, 2) + "\n";
      const putRes = await fetch(api, {
        method: "PUT", headers: { ...headers, "Content-Type": "application/json" },
        body: JSON.stringify({ message: `更新影片設定 ${todayStr()}`, content: toBase64(body), sha: cur.sha }),
      });
      if (!putRes.ok) {
        const err = await putRes.json().catch(() => ({}));
        throw new Error(`儲存失敗（${putRes.status}）${err.message ? "：" + err.message : ""}`);
      }
      const pj = await putRes.json().catch(() => null);
      if (pj?.content?.sha) setVSha(pj.content.sha);
      flash("pass", "影片設定已儲存，網站約 1–2 分鐘後更新。");
    } catch (e) {
      flash("fail", e.message || String(e));
    } finally { setVBusy(false); }
  };

  /* 修改某支影片的覆寫設定 */
  const setOverride = (videoId, patch) => {
    const ov = { ...(vdata.overrides || {}) };
    const cur = { ...(ov[videoId] || {}), ...patch };
    Object.keys(cur).forEach(k => {
      if (cur[k] === "" || cur[k] === undefined || cur[k] === false) delete cur[k];
    });
    if (Object.keys(cur).length) ov[videoId] = cur; else delete ov[videoId];

    /* 同步更新畫面上的顯示值 */
    const videos = (vdata.videos || []).map(v => v.videoId !== videoId ? v : {
      ...v,
      titleShown: cur.title || v.title,
      descShown: cur.desc || v.desc,
      category: cur.category || "",
      hidden: !!cur.hidden,
    });
    setVdata({ ...vdata, overrides: ov, videos });
  };

  const publish = async () => {
    if (!token.trim()) { flash("fail", "請先填入 GitHub 權杖"); return; }
    saveBackup(data, "發布前");
    setBackups(loadBackups());
    setBusy(true);
    try {
      const api = `https://api.github.com/repos/${repo.trim()}/contents/${DATA_PATH}`;
      const headers = { Authorization: `Bearer ${token.trim()}`, Accept: "application/vnd.github+json" };

      const getRes = await fetch(api, { headers, cache: "no-store" });
      if (!getRes.ok) throw new Error(`讀取失敗（${getRes.status}）。請確認權杖權限與儲存庫名稱。`);
      const cur = await getRes.json();

      /* 防呆：線上版本若比後台載入時更新，代表中間有人改過，先問過再覆蓋 */
      if (baseSha && cur.sha !== baseSha) {
        let onlineInfo = "";
        try {
          const raw = decodeURIComponent(escape(atob(cur.content.replace(/\n/g, ""))));
          const od = JSON.parse(raw);
          const total = (od.articles || []).length;
          const pub = (od.articles || []).filter(a => !a.draft).length;
          onlineInfo = `\n\n線上目前：${total} 篇，其中 ${pub} 篇已發布`;
        } catch {}
        const mineTotal = data.articles.length;
        const minePub = data.articles.filter(a => !a.draft).length;
        const ok = confirm(
          "偵測到線上的文章資料在你開啟後台之後被改過。" +
          "\n若繼續發布，線上的變更會被你目前的內容取代。" +
          onlineInfo +
          `\n你要發布的：${mineTotal} 篇，其中 ${minePub} 篇已發布` +
          "\n\n確定要覆蓋嗎？（建議先取消，重新整理後台載入最新版本）"
        );
        if (!ok) { setBusy(false); flash("fail", "已取消發布。請重新整理後台（Ctrl+F5）載入最新版本。"); return; }
      }

      const putRes = await fetch(api, {
        method: "PUT", headers: { ...headers, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: `更新文章 ${todayStr()}`,
          content: toBase64(jsonText()),
          sha: cur.sha,
        }),
      });
      if (!putRes.ok) {
        const err = await putRes.json().catch(() => ({}));
        throw new Error(`發布失敗（${putRes.status}）${err.message ? "：" + err.message : ""}`);
      }
      const putJson = await putRes.json().catch(() => null);
      if (putJson?.content?.sha) setBaseSha(putJson.content.sha);
      sessionStorage.setItem("cg_token", token.trim());
      flash("pass", "發布成功！網站約 1–2 分鐘後更新。");
    } catch (e) {
      flash("fail", e.message || String(e));
    } finally { setBusy(false); }
  };

  /* ---- 畫面 ---- */
  if (loadErr) return (
    <div className="max-w-2xl mx-auto px-6 py-20">
      <h1 className="display text-[24px] mb-4">讀不到文章資料</h1>
      <p className="text-[16px] text-inkSoft leading-[1.9]">
        後台需要透過網址開啟才能讀取資料，不能直接雙擊本機檔案。
        請用 <span className="font-mono text-[14px]">你的網站網址/admin/</span> 開啟。
      </p>
    </div>
  );

  if (!data) return <div className="max-w-2xl mx-auto px-6 py-20 font-mono text-[13px] text-inkFaint">讀取中…</div>;

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-50 bg-paper/95 backdrop-blur-sm border-b border-line">
        <div className="max-w-6xl mx-auto px-6 h-[68px] flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <img src="../assets/logo-icon.png" alt="" className="w-9 h-9 object-contain" />
            <span className="leading-tight">
              <span className="block font-mono text-[11px] tracking-[0.2em] text-inkFaint">ADMIN</span>
              <span className="block text-[17px] font-bold tracking-tight">文章後台</span>
            </span>
          </div>
          <div className="flex items-center gap-1 mr-auto ml-8">
            {[["articles","文章"],["videos","影片"],["deals","賀成交"],["buyers","買方需求"],["communities","社區"]].map(([k,label]) => (
              <button key={k} onClick={() => setTab(k)}
                className={`px-4 py-2 text-[14px] rounded-sm transition ${
                  tab===k ? "bg-ink text-white" : "text-inkSoft hover:text-ink"}`}>
                {label}
              </button>
            ))}
          </div>

          <div className="flex items-center gap-2">
            {tab === "articles" && <Btn variant="outline" size="sm" onClick={() => fileRef.current.click()}>載入檔案</Btn>}
            <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={importFile} />
            {tab === "articles" && <Btn variant="outline" size="sm" onClick={download}>下載</Btn>}
            {tab === "articles" && (
              <Btn variant="outline" size="sm" onClick={() => { setBackups(loadBackups()); setShowBackups(!showBackups); }}>
                備份紀錄
              </Btn>
            )}
            <Btn variant="dark" size="sm" onClick={() => setShowPublish(!showPublish)}>發布設定</Btn>
          </div>
        </div>

        {msg && (
          <div className={`px-6 py-3 text-[14px] ${msg.type === "pass" ? "bg-pass text-white" : "bg-fail text-white"}`}>
            <div className="max-w-6xl mx-auto">{msg.text}</div>
          </div>
        )}
      </header>

      {showBackups && (
        <div className="bg-surface border-b border-line">
          <div className="max-w-6xl mx-auto px-6 py-7">
            <h2 className="display text-[19px] mb-2">備份紀錄</h2>
            <p className="text-[15px] text-inkSoft leading-[1.9] mb-5 max-w-3xl">
              每次開啟後台、發布或下載前，都會自動存一份到這台電腦的瀏覽器，最多保留 10 份。
              萬一資料被覆蓋，可以在這裡還原。
            </p>

            {backups.length === 0 ? (
              <p className="text-[15px] text-inkFaint">還沒有備份紀錄。</p>
            ) : (
              <div className="border border-line rounded-sm overflow-hidden max-w-3xl">
                {backups.map((b, i) => (
                  <div key={i} className="bg-paper border-b border-line last:border-0 px-5 py-4 flex flex-wrap items-center gap-4">
                    <div className="flex-1 min-w-[200px]">
                      <div className="font-mono text-[13px] text-ink">{fmtStamp(b.at)}</div>
                      <div className="text-[13px] text-inkFaint mt-0.5">
                        {b.note}・{b.count} 篇（{b.published} 篇已發布）
                      </div>
                    </div>
                    <Btn size="sm" variant="outline"
                      onClick={() => {
                        if (!confirm(`確定要還原到 ${fmtStamp(b.at)} 的版本？\n目前編輯中的內容會被取代。`)) return;
                        try {
                          const d = JSON.parse(b.json);
                          saveBackup(data, "還原前");
                          setData(d);
                          setDraft(null); setIdx(null);
                          setBackups(loadBackups());
                          flash("pass", "已還原到瀏覽器裡的版本。確認內容正確後，記得按「發布」或「下載」才會更新網站。");
                        } catch { flash("fail", "這份備份損毀，無法還原"); }
                      }}>
                      還原
                    </Btn>
                  </div>
                ))}
              </div>
            )}

            <p className="text-[13px] text-inkFaint leading-relaxed mt-5 max-w-3xl">
              備份只存在這台電腦的這個瀏覽器，換電腦或清除瀏覽資料就會消失。
              重要版本建議另外按「下載」保存檔案。
            </p>
          </div>
        </div>
      )}

      {showPublish && (
        <div className="bg-surface border-b border-line">
          <div className="max-w-6xl mx-auto px-6 py-7">
            <h2 className="display text-[19px] mb-3">直接發布到網站</h2>
            <p className="text-[15px] text-inkSoft leading-[1.9] mb-5 max-w-3xl">
              填入 GitHub 權杖後，按「發布」就會直接更新網站，不用手動上傳。
              權杖只存在這個瀏覽器分頁，關掉分頁就會清除。
            </p>
            <div className="bg-tint border-l-2 border-orange px-5 py-4 mb-5 max-w-3xl">
              <p className="text-[14px] text-orangeDeep leading-[1.9]">
                權杖等同你的 GitHub 帳號權限，請勿在公用電腦使用，也不要給別人。
                建議用 Fine-grained token，權限只開這一個儲存庫的 Contents 讀寫。
                <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer"
                  className="underline ml-1">前往建立權杖 →</a>
              </p>
            </div>
            <div className="grid md:grid-cols-2 gap-5 max-w-3xl">
              <div>
                <Label>儲存庫</Label>
                <input className={inputCls} value={repo} onChange={e => setRepo(e.target.value)} />
              </div>
              <div>
                <Label hint="貼上後不會顯示在畫面上">GitHub 權杖</Label>
                <input type="password" className={inputCls} value={token}
                  placeholder="github_pat_..." onChange={e => setToken(e.target.value)} />
              </div>
            </div>
            <div className="mt-5 flex flex-wrap gap-3">
              <Btn onClick={publish} disabled={busy}>{busy ? "發布中…" : "發布到網站"}</Btn>
              <Btn variant="outline" onClick={copyJson}>複製 JSON</Btn>
              <Btn variant="outline" onClick={async () => {
                if (!token.trim()) { flash("fail", "請先填入權杖"); return; }
                await loadData(token.trim(), repo.trim());
                setDraft(null); setIdx(null);
                flash("pass", "已重新載入線上最新版本");
              }}>
                重新載入線上版本
              </Btn>
              <Btn variant="outline" onClick={() => { sessionStorage.removeItem("cg_token"); setToken(""); flash("pass","已清除權杖"); }}>
                清除權杖
              </Btn>
            </div>
          </div>
        </div>
      )}

      <main className="max-w-6xl mx-auto px-6 py-10">
        {/* ============ 影片分頁 ============ */}
        {tab === "videos" && (
          <>
            <div className="flex flex-wrap items-center justify-between gap-4 mb-8">
              <div>
                <h1 className="display text-[26px]">影片管理</h1>
                <p className="text-[15px] text-inkSoft mt-2">
                  影片清單每 6 小時自動同步自 YouTube 頻道，這裡只調整網站上的顯示方式。在 YouTube 改成不公開或刪除的影片，同步時會自動從網站隱藏。
                  {vdata?.updatedAt && (
                    <span className="font-mono text-[13px] text-inkFaint block mt-1">
                      上次同步：{new Date(vdata.updatedAt).toLocaleString("zh-TW")}
                    </span>
                  )}
                </p>
              </div>
              <div className="flex gap-2">
                <Btn variant="outline" size="sm" onClick={() => loadVideos(token.trim(), repo.trim())}>
                  重新載入
                </Btn>
                <Btn onClick={publishVideos} disabled={vBusy}>{vBusy ? "儲存中…" : "儲存設定"}</Btn>
              </div>
            </div>

            {!vdata && <p className="font-mono text-[13px] text-inkFaint">讀取中…</p>}

            {vdata && (vdata.videos || []).length === 0 && (
              <div className="bg-surface border border-line rounded-sm p-8">
                <p className="text-[16px] text-inkSoft leading-[1.9]">
                  還沒有同步到影片。到 GitHub 的 Actions 頁面手動執行一次「同步 YouTube 影片」，
                  或等待每 6 小時的自動排程。
                </p>
              </div>
            )}

            {vdata && (vdata.videos || []).length > 0 && (
              <>
                <div className="bg-surface border border-line rounded-sm p-6 mb-6">
                  <Label hint="留空則自動使用最新一支影片">首頁主視覺影片</Label>
                  <select className={inputCls} value={vdata.heroVideoId || ""}
                    onChange={e => setVdata({ ...vdata, heroVideoId: e.target.value })}>
                    <option value="">自動使用最新一支</option>
                    {vdata.videos.filter(v => !v.hidden).map(v => (
                      <option key={v.videoId} value={v.videoId}>{v.titleShown || v.title}</option>
                    ))}
                  </select>
                  <p className="text-[13px] text-inkFaint mt-2 leading-relaxed">
                    首頁的影片會自動播放且靜音，建議選畫面好看、開頭就有重點的影片。
                  </p>
                </div>

                <div className="space-y-4">
                  {vdata.videos.map(v => {
                    const o = (vdata.overrides || {})[v.videoId] || {};
                    return (
                      <div key={v.videoId}
                        className={`bg-surface border rounded-sm p-5 ${v.hidden ? "border-line opacity-60" : "border-line"}`}>
                        <div className="flex flex-wrap gap-5">
                          <img src={v.thumb} alt="" className="w-40 aspect-video object-cover rounded-sm border border-line shrink-0" />
                          <div className="flex-1 min-w-[280px] space-y-3">
                            <div className="flex items-center gap-3 font-mono text-[12px] text-inkFaint">
                              <span>{v.published}</span>
                              <a href={`https://www.youtube.com/watch?v=${v.videoId}`} target="_blank"
                                rel="noopener noreferrer" className="hover:text-orangeDeep underline">
                                在 YouTube 開啟
                              </a>
                              {vdata.heroVideoId === v.videoId && (
                                <span className="text-orangeDeep border border-orange/40 rounded-sm px-2 py-0.5">首頁</span>
                              )}
                              {v.autoHidden && (
                                <span className="text-fail border border-fail/40 rounded-sm px-2 py-0.5">
                                  已在 YouTube 下架{v.missingSince ? `（${v.missingSince}）` : ""}
                                </span>
                              )}
                            </div>
                            <div className="text-[13px] text-inkFaint">
                              YouTube 原標題：{v.title}
                            </div>
                            <div>
                              <Label hint="留空則使用 YouTube 原標題。網站上建議寫得更好搜尋">網站顯示標題</Label>
                              <input className={inputCls} value={o.title || ""}
                                placeholder={v.title}
                                onChange={e => setOverride(v.videoId, { title: e.target.value })} />
                            </div>
                            <div className="grid sm:grid-cols-2 gap-3">
                              <div>
                                <Label>分類</Label>
                                <select className={inputCls} value={o.category || ""}
                                  onChange={e => setOverride(v.videoId, { category: e.target.value })}>
                                  <option value="">未分類</option>
                                  {(vdata.categories || []).map(c => <option key={c}>{c}</option>)}
                                </select>
                              </div>
                              <div className="flex items-end pb-1">
                                <label className="flex gap-3 items-center cursor-pointer">
                                  <input type="checkbox" checked={!!o.hidden}
                                    onChange={e => setOverride(v.videoId, { hidden: e.target.checked })} />
                                  <span className="text-[15px]">
                                    在網站上隱藏這支影片
                                    {v.autoHidden && <span className="block text-[13px] text-fail mt-0.5">
                                      這支已在 YouTube 下架，網站上已自動隱藏
                                    </span>}
                                  </span>
                                </label>
                              </div>
                            </div>
                            <div>
                              <Label hint="留空則使用 YouTube 說明的第一行">網站顯示說明</Label>
                              <textarea rows={2} className={inputCls} value={o.desc || ""}
                                placeholder={v.desc}
                                onChange={e => setOverride(v.videoId, { desc: e.target.value })} />
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="mt-8 flex gap-3">
                  <Btn onClick={publishVideos} disabled={vBusy}>{vBusy ? "儲存中…" : "儲存設定"}</Btn>
                </div>
                <p className="text-[14px] text-inkFaint leading-relaxed mt-4">
                  這裡的修改要按「儲存設定」才會寫回網站。自動同步時不會覆蓋你的設定。
                </p>
              </>
            )}
          </>
        )}

        {/* ============ 賀成交分頁 ============ */}
        {tab === "deals" && (
          <>
            <div className="flex flex-wrap items-center justify-between gap-4 mb-8">
              <div>
                <h1 className="display text-[26px]">賀成交</h1>
                <p className="text-[15px] text-inkSoft mt-2">
                  首頁顯示最新 6 筆，全部成交紀錄另有獨立頁面。新增的會排在最前面。
                </p>
              </div>
              <div className="flex gap-2">
                <Btn variant="outline" size="sm" onClick={() => loadDeals(token.trim(), repo.trim())}>重新載入</Btn>
                <Btn onClick={publishDeals} disabled={dBusy}>{dBusy ? "儲存中…" : "儲存並發布"}</Btn>
              </div>
            </div>

            {!ddata && <p className="font-mono text-[13px] text-inkFaint">讀取中…</p>}

            {ddata && (
              <>
                <div className="bg-surface border border-line rounded-sm p-6 mb-6">
                  <Label hint="顯示在賀成交區塊標題下方">開場說明</Label>
                  <input className={inputCls} value={ddata.intro || ""}
                    onChange={e => setDdata({ ...ddata, intro: e.target.value })} />
                </div>

                <Btn variant="outline"
                  onClick={() => setDdata({
                    ...ddata,
                    deals: [{ id: `d-${Date.now()}`, img: "", area: "美術館特區", community: "", caption: "", hidden: false },
                            ...(ddata.deals || [])],
                  })}>
                  ＋ 新增成交
                </Btn>

                <div className="space-y-4 mt-6">
                  {(ddata.deals || []).map((d, i) => {
                    const upd = patch => {
                      const list = [...ddata.deals]; list[i] = { ...d, ...patch };
                      setDdata({ ...ddata, deals: list });
                    };
                    return (
                      <div key={d.id || i}
                        className={`bg-surface border border-line rounded-sm p-6 ${d.hidden ? "opacity-60" : ""}`}>
                        <div className="flex items-center justify-between mb-5">
                          <span className="font-mono text-[13px] text-orangeDeep">
                            {String(i + 1).padStart(2, "0")}
                            {i < 6 && !d.hidden && <span className="text-inkFaint ml-2">顯示在首頁</span>}
                          </span>
                          <div className="flex items-center gap-3">
                            <label className="flex gap-2 items-center cursor-pointer text-[14px] text-inkSoft">
                              <input type="checkbox" checked={!!d.hidden}
                                onChange={e => upd({ hidden: e.target.checked })} />
                              暫時隱藏
                            </label>
                            <Btn size="sm" variant="outline" disabled={i === 0}
                              onClick={() => {
                                const list = [...ddata.deals];
                                [list[i - 1], list[i]] = [list[i], list[i - 1]];
                                setDdata({ ...ddata, deals: list });
                              }}>↑</Btn>
                            <Btn size="sm" variant="danger"
                              onClick={() => {
                                if (!confirm("確定刪除這筆成交？")) return;
                                setDdata({ ...ddata, deals: ddata.deals.filter((_, j) => j !== i) });
                              }}>刪除</Btn>
                          </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6">
                          <ImagePicker src={d.img} uploader={uploadDealImage} label="賀成交圖片"
                            onPick={v => upd({ img: v })} />

                          <div className="space-y-4">
                            <div>
                              <Label>區域</Label>
                              <select className={inputCls} value={d.area || ""}
                                onChange={e => upd({ area: e.target.value })}>
                                {["美術館特區", "農十六特區", "瑞豐巨蛋", "中都重劃區", "其他區域"]
                                  .map(a => <option key={a}>{a}</option>)}
                              </select>
                            </div>
                            <div>
                              <Label hint="沒有或不方便公開可留空">社區名稱</Label>
                              <input className={inputCls} value={d.community || ""}
                                placeholder="白天鵝" onChange={e => upd({ community: e.target.value })} />
                            </div>
                            <div>
                              <Label hint="物件特色，例如：高樓層景觀三房平車">說明</Label>
                              <input className={inputCls} value={d.caption || ""}
                                placeholder="高樓層景觀三房平車" onChange={e => upd({ caption: e.target.value })} />
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                  {(ddata.deals || []).length === 0 && (
                    <div className="bg-surface border border-line rounded-sm p-8 text-[15px] text-inkSoft">
                      還沒有成交紀錄，按上方「＋ 新增成交」開始。
                    </div>
                  )}
                </div>

                <div className="mt-8 flex flex-wrap gap-3">
                  <Btn onClick={publishDeals} disabled={dBusy}>{dBusy ? "儲存中…" : "儲存並發布"}</Btn>
                </div>
                <p className="text-[14px] text-inkFaint leading-relaxed mt-4">
                  沒有任何成交紀錄時，首頁與獨立頁面都不會顯示。圖片會自動壓縮後上傳到 assets/deals/。
                </p>
              </>
            )}
          </>
        )}

                        <div>
                          <Label hint="例如：美術館特區、農十六（不要寫特定社區名稱）">想找的區域</Label>
                          <input className={inputCls} value={b.area || ""}
                            placeholder="美術館特區 / 農十六"
                            onChange={e => {
                              const buyers = [...bdata.buyers]; buyers[i] = { ...b, area: e.target.value };
                              setBdata({ ...bdata, buyers });
                            }} />
                        </div>

                        <div className="grid sm:grid-cols-3 gap-4">
                          <div>
                            <Label>坪數</Label>
                            <input className={inputCls} value={b.size || ""}
                              placeholder="30–40 坪"
                              onChange={e => {
                                const buyers = [...bdata.buyers]; buyers[i] = { ...b, size: e.target.value };
                                setBdata({ ...bdata, buyers });
                              }} />
                          </div>
                          <div>
                            <Label>預算</Label>
                            <input className={inputCls} value={b.budget || ""}
                              placeholder="1,300 萬內"
                              onChange={e => {
                                const buyers = [...bdata.buyers]; buyers[i] = { ...b, budget: e.target.value };
                                setBdata({ ...bdata, buyers });
                              }} />
                          </div>
                          <div>
                            <Label hint="例如 2026.07">更新時間</Label>
                            <input className={inputCls} value={b.updated || ""}
                              placeholder="2026.07"
                              onChange={e => {
                                const buyers = [...bdata.buyers]; buyers[i] = { ...b, updated: e.target.value };
                                setBdata({ ...bdata, buyers });
                              }} />
                          </div>
                        </div>

                        <div>
                          <Label hint="一行一項，例如：三房含平面車位／需電梯／可接受屋齡 20 年內">需求重點</Label>
                          <textarea rows={4} className={inputCls}
                            value={(b.notes || []).join("\n")}
                            placeholder={"三房含平面車位\n需電梯大樓\n可接受屋齡 20 年內\n資金已備妥，可配合交屋時間"}
                            onChange={e => {
                              const buyers = [...bdata.buyers];
                              buyers[i] = { ...b, notes: e.target.value.split("\n").map(t => t.trim()).filter(Boolean) };
                              setBdata({ ...bdata, buyers });
                            }} />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="mt-6 flex flex-wrap gap-3">
                  <Btn variant="outline"
                    onClick={() => setBdata({
                      ...bdata,
                      buyers: [...(bdata.buyers || []), {
                        id: `b-${Date.now()}`, area: "", size: "", budget: "",
                        updated: todayStr().slice(0, 7).replace("-", "."), notes: [],
                      }],
                    })}>
                    ＋ 新增一筆需求
                  </Btn>
                  <Btn onClick={publishBuyers} disabled={bBusy}>{bBusy ? "儲存中…" : "儲存並發布"}</Btn>
                </div>

                <p className="text-[14px] text-inkFaint leading-relaxed mt-4">
                  沒有任何需求時，首頁不會顯示這個區塊。
                </p>
              </>
            )}
          </>
        )}

        {/* ============ 文章分頁 ============ */}
        {tab === "articles" && draftArticle === null && (
          <>
            <div className="flex items-center justify-between mb-8">
              <div>
                <h1 className="display text-[26px]">文章列表</h1>
                <p className="text-[15px] text-inkSoft mt-2">
                  共 {data.articles.length} 篇，其中 {data.articles.filter(a => a.draft).length} 篇為草稿（網站上看不到）
                </p>
              </div>
              <Btn onClick={startNew}>＋ 寫新文章</Btn>
            </div>

            <div className="border border-line rounded-sm overflow-hidden">
              {data.articles.map((a, i) => (
                <div key={a.slug + i}
                  className="bg-surface border-b border-line last:border-0 p-5 flex flex-wrap items-center gap-4">
                  <div className="flex-1 min-w-[240px]">
                    <div className="flex items-center gap-3 mb-1.5">
                      <span className="font-mono text-[12px] text-orangeDeep tracking-wider">{a.tag}</span>
                      <span className="font-mono text-[12px] text-inkFaint">{a.date}</span>
                      {a.draft
                        ? <span className="font-mono text-[11px] text-inkFaint border border-line rounded-sm px-2 py-0.5">草稿</span>
                        : <span className="font-mono text-[11px] text-pass border border-pass/40 rounded-sm px-2 py-0.5">已發布</span>}
                      {a.reviewBy && a.reviewBy <= todayStr() && (
                        <span className="font-mono text-[11px] text-orangeDeep border border-orange/40 rounded-sm px-2 py-0.5">該檢視了</span>
                      )}
                    </div>
                    <div className="text-[16px] font-bold tracking-tight">{a.title || "（未命名）"}</div>
                  </div>
                  <div className="flex items-center gap-2">
                    <Btn size="sm" variant="outline" onClick={() => toggleDraft(i)}>
                      {a.draft ? "設為發布" : "收回草稿"}
                    </Btn>
                    <Btn size="sm" variant="outline" onClick={() => startEdit(i)}>編輯</Btn>
                    <Btn size="sm" variant="danger" onClick={() => removeArticle(i)}>刪除</Btn>
                  </div>
                </div>
              ))}
              {data.articles.length === 0 && (
                <div className="bg-surface p-8 text-[15px] text-inkSoft">還沒有文章，按右上角開始寫第一篇。</div>
              )}
            </div>

            <div className="mt-8 bg-surface border border-line rounded-sm p-6">
              <h2 className="font-mono text-[12px] tracking-[0.18em] text-orangeDeep uppercase mb-3">怎麼讓修改生效</h2>
              <p className="text-[15px] text-inkSoft leading-[1.9]">
                在這裡的編輯只存在你的瀏覽器裡。改完之後要選一種方式送出去：
                填了權杖就按「發布到網站」，或是按「下載」把 articles.json 上傳到 GitHub 的 data 資料夾覆蓋原檔。
                兩種方式效果一樣。
              </p>
            </div>
          </>
        )}

        {/* 編輯模式 */}
        {tab === "articles" && draftArticle && (
          <div className="grid lg:grid-cols-2 gap-8">
            <div>
              <div className="flex items-center justify-between mb-6">
                <h1 className="display text-[22px]">{idx === -1 ? "寫新文章" : "編輯文章"}</h1>
                <div className="flex gap-2">
                  <Btn size="sm" variant="outline" onClick={cancel}>取消</Btn>
                  <Btn size="sm" onClick={saveToList}>完成</Btn>
                </div>
              </div>

              <div className="bg-surface border border-line rounded-sm p-6 space-y-5">
                <div>
                  <Label>標題</Label>
                  <input className={inputCls} value={draftArticle.title}
                    placeholder="例如：新青安 3.0 上路：額度提高了，但多了三道門檻"
                    onChange={e => setDraft({ ...draftArticle, title: e.target.value })} />
                </div>

                <div>
                  <Label hint="列表上會顯示這段，寫得具體一點比較吸引人點進來">摘要</Label>
                  <textarea rows={3} className={inputCls} value={draftArticle.summary}
                    onChange={e => setDraft({ ...draftArticle, summary: e.target.value })} />
                </div>

                <ImagePicker src={draftArticle.cover} uploader={uploadImage} label="封面圖（選填）"
                  onPick={v => setDraft({ ...draftArticle, cover: v || undefined })} />

                {draftArticle.cover && (
                  <div>
                    <Label hint="給看不到圖片的人與搜尋引擎看的描述">封面替代文字</Label>
                    <input className={inputCls} value={draftArticle.coverAlt || ""}
                      onChange={e => setDraft({ ...draftArticle, coverAlt: e.target.value })} />
                  </div>
                )}

                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <Label>分類</Label>
                    <select className={inputCls} value={draftArticle.tag}
                      onChange={e => setDraft({ ...draftArticle, tag: e.target.value })}>
                      {TAGS.map(t => <option key={t}>{t}</option>)}
                    </select>
                  </div>
                  <div>
                    <Label hint="留空會自動依標題產生">網址代號</Label>
                    <input className={inputCls} value={draftArticle.slug}
                      placeholder="qingan-3-0-thresholds"
                      onChange={e => setDraft({ ...draftArticle, slug: e.target.value })} />
                  </div>
                  <div>
                    <Label>發布日期</Label>
                    <input type="date" className={inputCls} value={draftArticle.date}
                      onChange={e => setDraft({ ...draftArticle, date: e.target.value })} />
                  </div>
                  <div>
                    <Label hint="超過這天，文章會自動顯示時效提醒">下次檢視</Label>
                    <input type="date" className={inputCls} value={draftArticle.reviewBy || ""}
                      onChange={e => setDraft({ ...draftArticle, reviewBy: e.target.value })} />
                  </div>
                  <div>
                    <Label>閱讀時間（分鐘）</Label>
                    <input type="number" min="1" className={inputCls} value={draftArticle.readMinutes}
                      onChange={e => setDraft({ ...draftArticle, readMinutes: Number(e.target.value) })} />
                  </div>
                  <div>
                    <Label>狀態</Label>
                    <select className={inputCls} value={draftArticle.draft ? "draft" : "published"}
                      onChange={e => setDraft({ ...draftArticle, draft: e.target.value === "draft" })}>
                      <option value="draft">草稿（網站看不到）</option>
                      <option value="published">發布</option>
                    </select>
                  </div>
                </div>
              </div>

              <div className="mt-6 space-y-4">
                {draftArticle.blocks.map((b, i) => (
                  <BlockEditor key={i} block={b} uploader={uploadImage}
                    isFirst={i === 0} isLast={i === draftArticle.blocks.length - 1}
                    onChange={nb => {
                      const blocks = [...draftArticle.blocks]; blocks[i] = nb;
                      setDraft({ ...draftArticle, blocks });
                    }}
                    onRemove={() => setDraft({ ...draftArticle, blocks: draftArticle.blocks.filter((_, j) => j !== i) })}
                    onMove={dir => {
                      const blocks = [...draftArticle.blocks];
                      const j = i + dir; if (j < 0 || j >= blocks.length) return;
                      [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
                      setDraft({ ...draftArticle, blocks });
                    }} />
                ))}
              </div>

              <div className="mt-5 flex flex-wrap gap-2">
                {BLOCK_TYPES.map(t => (
                  <Btn key={t.type} size="sm" variant="outline"
                    onClick={() => setDraft({ ...draftArticle, blocks: [...draftArticle.blocks, emptyBlock(t.type)] })}>
                    ＋ {t.label}
                  </Btn>
                ))}
              </div>

              <details className="mt-6 bg-surface border border-line rounded-sm">
                <summary className="cursor-pointer px-5 py-4 text-[15px] font-medium select-none">
                  貼上長文，自動分段
                </summary>
                <div className="px-5 pb-5">
                  <p className="text-[14px] text-inkSoft leading-[1.9] mb-3">
                    從 R.TUBE、Word、記事本或其他地方複製整篇文章貼進來，會自動整理成：
                    <strong className="text-ink">段落、小標、條列</strong>，並順便抓出
                    <strong className="text-ink">標題、摘要、#關鍵字、Q&amp;A 問答</strong>。
                    平台的介面文字（發佈時間、分享、留言等）會自動略過。
                    已經填過的標題與摘要不會被覆蓋，拆完之後可以再逐一調整。
                  </p>
                  <textarea rows={8} className={inputCls} value={bulkText}
                    placeholder="把整篇文章貼在這裡…"
                    onChange={e => setBulkText(e.target.value)} />
                  <div className="mt-3 flex flex-wrap gap-2">
                    <Btn size="sm"
                      onClick={() => {
                        if (!bulkText.trim()) { flash("fail", "請先貼上內容"); return; }
                        const r = parseLongText(bulkText, { detectTitle: !draftArticle.title.trim() });
                        const patch = { ...draftArticle, blocks: [...draftArticle.blocks, ...r.blocks] };
                        const got = [];
                        if (r.title && !patch.title.trim()) { patch.title = r.title; got.push("標題"); }
                        if (r.summary && !patch.summary.trim()) { patch.summary = r.summary; got.push("摘要"); }
                        if (r.keywords.length) {
                          const merged = [...new Set([...(patch.keywords || []), ...r.keywords])];
                          patch.keywords = merged; got.push(`${r.keywords.length} 個關鍵字`);
                        }
                        if (r.faq.length) {
                          patch.faq = [...(patch.faq || []), ...r.faq.map(([q, a]) => ({ q, a }))];
                          got.push(`${r.faq.length} 題 FAQ`);
                        }
                        setDraft(patch);
                        setBulkText("");
                        flash("pass", `已加入 ${r.blocks.length} 個區塊` + (got.length ? `，並自動填入${got.join("、")}` : ""));
                      }}>
                      加到文章末尾
                    </Btn>
                    <Btn size="sm" variant="outline"
                      onClick={() => {
                        if (!bulkText.trim()) { flash("fail", "請先貼上內容"); return; }
                        if (!confirm("這會取代目前所有內文區塊，確定嗎？\n（標題、摘要、關鍵字若已填寫則會保留）")) return;
                        const r = parseLongText(bulkText, { detectTitle: !draftArticle.title.trim() });
                        const patch = { ...draftArticle, blocks: r.blocks };
                        const got = [];
                        if (r.title && !patch.title.trim()) { patch.title = r.title; got.push("標題"); }
                        if (r.summary && !patch.summary.trim()) { patch.summary = r.summary; got.push("摘要"); }
                        if (r.keywords.length) {
                          patch.keywords = [...new Set([...(patch.keywords || []), ...r.keywords])];
                          got.push(`${r.keywords.length} 個關鍵字`);
                        }
                        if (r.faq.length) {
                          patch.faq = [...(patch.faq || []), ...r.faq.map(([q, a]) => ({ q, a }))];
                          got.push(`${r.faq.length} 題 FAQ`);
                        }
                        setDraft(patch);
                        setBulkText("");
                        flash("pass", `已取代為 ${r.blocks.length} 個區塊` + (got.length ? `，並自動填入${got.join("、")}` : ""));
                      }}>
                      取代全部內容
                    </Btn>
                  </div>
                </div>
              </details>

              {/* SEO / GEO 欄位 */}
              <div className="mt-8 bg-surface border border-line rounded-sm p-6 space-y-6">
                <div className="font-mono text-[12px] tracking-[0.18em] text-orangeDeep uppercase">
                  搜尋最佳化
                </div>

                <div>
                  <Label hint="用頓號或逗號分隔。想被搜尋到的字詞，例如：美術館特區、高雄買房、學區">關鍵字</Label>
                  <input className={inputCls}
                    value={(draftArticle.keywords || []).join("、")}
                    placeholder="美術館特區、農十六、高雄買房"
                    onChange={e => setDraft({
                      ...draftArticle,
                      keywords: e.target.value.split(/[、,，]/).map(t => t.trim()).filter(Boolean),
                    })} />
                </div>

                <div>
                  <Label hint="AI 與 Google 特別容易引用問答格式，建議每篇 3 題以上">常見問題</Label>
                  <div className="space-y-4">
                    {(draftArticle.faq || []).map((f, i) => (
                      <div key={i} className="border border-line rounded-sm p-4 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-mono text-[12px] text-inkFaint">Q{i + 1}</span>
                          <Btn size="sm" variant="danger"
                            onClick={() => setDraft({ ...draftArticle, faq: draftArticle.faq.filter((_, j) => j !== i) })}>
                            刪除
                          </Btn>
                        </div>
                        <input className={inputCls} value={f.q} placeholder="問題（用大家實際會搜尋的說法）"
                          onChange={e => {
                            const faq = [...draftArticle.faq]; faq[i] = { ...f, q: e.target.value };
                            setDraft({ ...draftArticle, faq });
                          }} />
                        <textarea rows={3} className={inputCls} value={f.a} placeholder="回答（寫成可以獨立閱讀的完整句子，AI 才好引用）"
                          onChange={e => {
                            const faq = [...draftArticle.faq]; faq[i] = { ...f, a: e.target.value };
                            setDraft({ ...draftArticle, faq });
                          }} />
                      </div>
                    ))}
                    <Btn size="sm" variant="outline"
                      onClick={() => setDraft({ ...draftArticle, faq: [...(draftArticle.faq || []), { q: "", a: "" }] })}>
                      ＋ 新增問題
                    </Btn>
                  </div>
                </div>

                <div>
                  <Label hint="標示官方或可查證的出處，提升可信度">資料來源</Label>
                  <div className="space-y-2">
                    {(draftArticle.sources || []).map((sc, i) => (
                      <div key={i} className="flex gap-2">
                        <input className={inputCls} value={sc.name} placeholder="來源名稱"
                          onChange={e => {
                            const sources = [...draftArticle.sources]; sources[i] = { ...sc, name: e.target.value };
                            setDraft({ ...draftArticle, sources });
                          }} />
                        <input className={inputCls} value={sc.url} placeholder="https://"
                          onChange={e => {
                            const sources = [...draftArticle.sources]; sources[i] = { ...sc, url: e.target.value };
                            setDraft({ ...draftArticle, sources });
                          }} />
                        <Btn size="sm" variant="outline"
                          onClick={() => setDraft({ ...draftArticle, sources: draftArticle.sources.filter((_, j) => j !== i) })}>✕</Btn>
                      </div>
                    ))}
                    <Btn size="sm" variant="outline"
                      onClick={() => setDraft({ ...draftArticle, sources: [...(draftArticle.sources || []), { name: "", url: "" }] })}>
                      ＋ 新增來源
                    </Btn>
                  </div>
                </div>
              </div>

              <div className="mt-8 flex gap-3">
                <Btn onClick={saveToList}>完成，回到列表</Btn>
                <Btn variant="outline" onClick={cancel}>取消不儲存</Btn>
              </div>
            </div>

            {/* 預覽 */}
            <div className="lg:sticky lg:top-[92px] lg:self-start">
              <div className="font-mono text-[12px] tracking-[0.18em] text-orangeDeep uppercase mb-4">預覽</div>
              <div className="bg-surface border border-line rounded-sm p-7 max-h-[75vh] overflow-y-auto">
                <div className="flex items-center gap-4 font-mono text-[12px] mb-3">
                  <span className="text-orangeDeep tracking-wider">{draftArticle.tag}</span>
                  <span className="text-inkFaint">{draftArticle.date}</span>
                  <span className="text-inkFaint">約 {draftArticle.readMinutes} 分鐘</span>
                </div>
                <h1 className="display text-[24px]">{draftArticle.title || "（標題）"}</h1>
                {draftArticle.summary && (
                  <p className="mt-4 text-[15px] text-inkSoft leading-[1.95]">{draftArticle.summary}</p>
                )}
                {draftArticle.cover && (
                  <img src={`../${draftArticle.cover}`} alt=""
                    className="w-full h-auto rounded-sm border border-line bg-paper mt-6" />
                )}
                <div className="mt-8">
                  {draftArticle.blocks.map((b, i) => <PreviewBlock key={i} block={b} />)}
                </div>
              </div>
            </div>
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
