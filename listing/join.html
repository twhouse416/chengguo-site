<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>澄果團隊成員資訊登記｜澄果上架</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--or:#FD7305;--bg:#F4F4F2;--ink:#151513;--mute:#62625c;--line:#dcdcd6;--ok:#18794e;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:18px max(5vw,16px)}
header b{font-weight:900;font-size:20px;letter-spacing:.02em}
header span{color:#bdbdb6;font-size:14px;margin-left:10px}
main{max-width:640px;margin:0 auto;padding:32px 16px 80px}
h1{font-weight:900;font-size:clamp(28px,5vw,36px);line-height:1.15;margin:0 0 6px}
.lead{color:var(--mute);margin:0 0 24px}
section{background:#fff;border:1px solid var(--line);border-radius:4px;padding:22px;margin:0 0 16px}
h2{font-size:19px;font-weight:900;margin:0 0 10px}
label{display:block;font-weight:700;font-size:15px;margin:14px 0 4px}
label small{font-weight:400;color:var(--mute);margin-left:6px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
input[readonly]{background:#ecece8;color:var(--mute)}
.hint{color:var(--mute);font-size:14px;margin:4px 0 0}
button,.btn{font:inherit;font-size:16px;min-height:46px;padding:10px 22px;border-radius:3px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.pri{background:var(--or);border-color:var(--or);color:#fff;font-weight:700}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,.btn:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.msg{min-height:24px;margin-top:12px;font-size:15px;white-space:pre-line}
.err{color:var(--bad)}.ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:7em 1fr;gap:4px 12px;font-size:15px}
.kv span:nth-child(odd){color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b>澄果上架</b><span>台灣房屋 澄果團隊｜同仁專用</span></header>
<main>
<h1>澄果團隊成員資訊登記</h1>
<p class="lead">請填寫您的 Google 帳號與聯絡資料，送出後由管理者核對並啟用，就能使用「澄果上架」。聯絡資料會自動放在廣告的聯絡資訊裡。</p>

<section id="formBox">
<h2>您的資料</h2>
<label for="email">Google 帳號（Gmail）</label>
<input id="email" type="email" maxlength="120" autocomplete="email" inputmode="email" placeholder="例如：wang@gmail.com">
<label for="email2">第二個 Google 帳號<small>選填，會用不同帳號上架才需要</small></label>
<input id="email2" type="email" maxlength="120" autocomplete="off" inputmode="email">
<label for="email3">第三個 Google 帳號<small>選填</small></label>
<input id="email3" type="email" maxlength="120" autocomplete="off" inputmode="email">
<p class="hint">請填你上架時 Chrome 右上角登入的帳號；用哪個帳號登入 Chrome，就要在這裡登記哪個帳號。</p>
<input id="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
<label for="name">姓名<small>廣告上的聯絡人名稱</small></label>
<input id="name" maxlength="20" autocomplete="name" placeholder="例如：王小明">
<label for="phone">電話<small>廣告上的聯絡電話</small></label>
<input id="phone" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="例如：0912-345-678">
<label for="line">LINE ID<small>選填</small></label>
<input id="line" maxlength="40" placeholder="例如：abc123">
<label for="lic">營業員證號</label>
<input id="lic" maxlength="40" placeholder="例如：(113)登字第000000號">
<p class="hint">營業員證號依《不動產經紀業管理條例》會標示在廣告上，請照證書填寫。</p>
<div style="margin-top:18px"><button class="pri" id="send">送出登記</button></div>
<div class="msg" id="msg"></div>
</section>

<p class="hint">本頁僅供澄果團隊同仁使用。資料只會寫入團隊管理者的名單試算表，管理者啟用後才能使用。</p>
</main>
<script>
{
const API = 'https://script.google.com/macros/s/AKfycbyU7eB6dXEm-fv-faA7trOK9kGjpqA7aXy-IjNYlMpVKk1LXp-8nJ6GTfATX57rdVGX/exec';
const TOKEN = 'cg_mXXrU7qcFjQaS-xUzTLGlUiG3Dq5WqYR';
const $ = id => document.getElementById(id);
const ERR = { 'already-active': '已經啟用（資料沒有更動，要修改請洽管理者）', missing: '姓名、電話、營業員證號都要填', email: '帳號格式不正確', action: '名單程式還沒更新，請洽管理者', 'not-listed': '名單程式還沒更新，請洽管理者', token: '登記頁設定有誤，請洽管理者' };
async function post(body) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, action: 'register', ...body }), redirect: 'follow' });
    return await r.json();
  } catch (e) {
    return { ok: false, message: '連不到名單，請確認網路連線後再試' };
  }
}
$('send').addEventListener('click', async () => {
  const v = id => $(id).value.trim(), msg = $('msg');
  const bad = t => { msg.className = 'msg err'; msg.textContent = t; };
  if ($('website').value) return bad('送出失敗。');
  const emails = [...new Set(['email', 'email2', 'email3'].map(id => v(id).toLowerCase()).filter(Boolean))];
  const data = { name: v('name'), phone: v('phone'), line: v('line'), lic: v('lic') };
  if (!emails.length) return bad('請至少填一個 Google 帳號。');
  const wrong = emails.find(e => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e));
  if (wrong) return bad(`「${wrong}」不是正確的帳號格式，例如 wang@gmail.com。`);
  if (!data.name || !data.phone || !data.lic) return bad('姓名、電話、營業員證號都要填。');
  if (!/^[\d\-+()\s#]{8,20}$/.test(data.phone)) return bad('電話格式看起來不對，請只填數字與「-」。');
  $('send').disabled = true; msg.className = 'msg'; msg.textContent = '送出中…';
  const lines = []; let okCount = 0;
  for (const email of emails) {
    const r = await post({ email, ...data });
    if (r && r.ok) { okCount++; lines.push(`✔ ${email}：${r.updated ? '已更新登記資料' : '登記完成'}`); }
    else lines.push(`✘ ${email}：${(r && (r.message || ERR[r.error])) || '登記失敗'}`);
  }
  $('send').disabled = false;
  msg.className = okCount ? 'msg ok' : 'msg err';
  msg.textContent = lines.join('\n') + (okCount ? '\n\n請通知管理者到名單勾選「啟用」，啟用後就能用這些帳號使用「澄果上架」。' : '');
});
$('email').focus();
}
</script>
</body>
</html>
