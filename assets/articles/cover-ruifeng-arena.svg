  <text x="860" y="150" font-family="'IBM Plex Mono',monospace" font-size="19" fill="#737A83">單價／坪</text>
  <text x="1010" y="150" font-family="'IBM Plex Mono',monospace" font-size="19" fill="#737A83">總價</text>

  <path d="M120 500 H1080" stroke="#DEDCD7" stroke-width="2"/>
  <g font-family="'IBM Plex Mono',monospace" font-size="21" fill="#737A83">
    <text x="120" y="556">35 個社區</text>
    <text x="400" y="556">1,010 筆住家成交</text>
    <text x="760" y="556">公設比中位 27.68%</text>
  </g>
  <path d="M120 606 H1080" stroke="#DEDCD7" stroke-width="2"/>
  <text x="120" y="664" font-family="'Noto Sans TC',sans-serif" font-size="30" font-weight="700" fill="#16191D">四區總價門檻最低，坪數中位 43.5 坪</text>
  <text x="120" y="712" font-family="'IBM Plex Mono',monospace" font-size="21" fill="#737A83">代價：35 個社區有 16 個是 1990 年代完工</text>
