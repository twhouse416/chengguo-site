<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F4F4F2"/>
  <text x="120" y="110" font-family="'IBM Plex Mono',monospace" font-size="23" fill="#737A83">高雄四大生活圈　住家成交中位數對照</text>

  <g font-family="'Noto Sans TC',sans-serif">
    <text x="120" y="208" font-size="28" fill="#16191D">美術館特區</text>
    <rect x="420" y="182" width="420" height="34" fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>
    <text x="860" y="209" font-size="25" font-family="'IBM Plex Mono',monospace" fill="#16191D">34.2 萬</text>
    <text x="1010" y="209" font-size="21" font-family="'IBM Plex Mono',monospace" fill="#737A83">1,705 萬</text>

    <text x="120" y="282" font-size="28" fill="#16191D">中都重劃區</text>
    <rect x="420" y="256" width="431" height="34" fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>
    <text x="871" y="283" font-size="25" font-family="'IBM Plex Mono',monospace" fill="#16191D">35.1 萬</text>
    <text x="1010" y="283" font-size="21" font-family="'IBM Plex Mono',monospace" fill="#737A83">1,318 萬</text>

    <text x="120" y="356" font-size="28" fill="#16191D">農十六特區</text>
    <rect x="420" y="330" width="403" height="34" fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>
    <text x="843" y="357" font-size="25" font-family="'IBM Plex Mono',monospace" fill="#16191D">32.8 萬</text>
    <text x="1010" y="357" font-size="21" font-family="'IBM Plex Mono',monospace" fill="#737A83">1,300 萬</text>

    <text x="120" y="430" font-size="28" font-weight="700" fill="#B85400">瑞豐・巨蛋</text>
    <rect x="420" y="404" width="370" height="34" fill="#FD7305" fill-opacity="0.85"/>
    <text x="810" y="431" font-size="25" font-weight="700" font-family="'IBM Plex Mono',monospace" fill="#B85400">30.1 萬</text>
    <text x="1010" y="431" font-size="21" font-weight="700" font-family="'IBM Plex Mono',monospace" fill="#B85400">1,130 萬</text>
