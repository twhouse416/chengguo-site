<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F4F4F2"/>

  <!-- 底部基準線 -->
  <path d="M120 620 H1080" stroke="#DEDCD7" stroke-width="2"/>

  <!-- 總價長條：自備款 vs 貸款 -->
  <g>
    <rect x="180" y="470" width="200" height="150" fill="#FD7305"/>
    <rect x="180" y="230" width="200" height="240" fill="#FFFFFF" stroke="#16191D" stroke-width="2"/>
    <text x="280" y="552" font-family="'Noto Sans TC',sans-serif" font-size="30" font-weight="700"
          fill="#FFFFFF" text-anchor="middle">自備款</text>
    <text x="280" y="368" font-family="'Noto Sans TC',sans-serif" font-size="30" font-weight="700"
          fill="#16191D" text-anchor="middle">貸款</text>
    <text x="280" y="672" font-family="'IBM Plex Mono',monospace" font-size="24"
          fill="#737A83" text-anchor="middle">房屋總價</text>
  </g>

  <!-- 加號 -->
  <g stroke="#C9C6C0" stroke-width="3" stroke-linecap="round">
    <path d="M448 545 H492"/>
    <path d="M470 523 V567"/>
  </g>

  <!-- 其他費用堆疊 -->
  <g>
    <rect x="560" y="580" width="150" height="40" fill="#FD7305" fill-opacity="0.85"/>
    <rect x="560" y="532" width="150" height="40" fill="#FD7305" fill-opacity="0.6"/>
    <rect x="560" y="484" width="150" height="40" fill="#FD7305" fill-opacity="0.4"/>
    <rect x="560" y="436" width="150" height="40" fill="#FD7305" fill-opacity="0.25"/>
    <text x="635" y="672" font-family="'IBM Plex Mono',monospace" font-size="24"
          fill="#737A83" text-anchor="middle">其他費用</text>

    <!-- 費用標籤 -->
    <g font-family="'Noto Sans TC',sans-serif" font-size="22" fill="#474D55">
      <text x="740" y="608">仲介服務費</text>
      <text x="740" y="560">代書費、規費、契稅</text>
      <text x="740" y="512">火險、地震險</text>
      <text x="740" y="464">裝潢與家電</text>
    </g>
    <g stroke="#DEDCD7" stroke-width="1.5">
      <path d="M718 600 H734"/>
      <path d="M718 552 H734"/>
      <path d="M718 504 H734"/>
      <path d="M718 456 H734"/>
    </g>
  </g>

  <!-- 房屋圖示 -->
  <g transform="translate(880,180)" stroke="#16191D" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <path d="M0 120 V50 L60 5 L120 50 V120 Z" fill="#FFFFFF"/>
    <path d="M42 120 V78 H78 V120"/>
    <circle cx="60" cy="45" r="7" fill="#FD7305" stroke="none"/>
  </g>

  <!-- 標題文字 -->
  <text x="120" y="140" font-family="'Noto Sans TC',sans-serif" font-size="52" font-weight="900"
        fill="#16191D" letter-spacing="-1">買房要準備的，不只頭期款</text>
  <text x="120" y="188" font-family="'IBM Plex Mono',monospace" font-size="24"
        fill="#B85400" letter-spacing="4">HOME BUYING COST</text>

  <!-- 底部識別 -->
  <text x="120" y="730" font-family="'IBM Plex Mono',monospace" font-size="20"
        fill="#737A83" letter-spacing="2">台灣房屋 澄果團隊</text>
</svg>
