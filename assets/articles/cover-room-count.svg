<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F4F4F2"/>
  <text x="120" y="88" font-family="'IBM Plex Mono',monospace" font-size="22" fill="#737A83">高雄四大生活圈　2020 年起 12,066 筆住家成交</text>
  <g>
    <rect x="120" y="230" width="120" height="35" fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>
    <rect x="120" y="290" width="135" height="35" fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>
    <rect x="120" y="350" width="215" height="35" fill="#FD7305" fill-opacity="0.85"/>
    <rect x="120" y="410" width="80" height="35" fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>
    <g font-family="'IBM Plex Mono',monospace" font-size="20" fill="#16191D">
      <text x="60" y="255">1房</text><text x="60" y="315">2房</text><text x="60" y="375">3房</text><text x="60" y="435">4房</text>
      <text x="260" y="255">7%　單價 34.9　總價 1,126 萬</text>
      <text x="275" y="315">27%　單價 32.0　總價 933 萬</text>
      <text x="355" y="375" font-weight="700" fill="#B85400">43%　單價 32.8　總價 1,668 萬</text>
      <text x="220" y="435">16%　單價 31.3　總價 2,500 萬</text>
    </g>
  </g>
  <text x="120" y="492" font-family="'IBM Plex Mono',monospace" font-size="18" fill="#737A83">長度為成交占比　｜　單價單位萬元／坪，總價為中位數</text>

  <path d="M120 536 H1080" stroke="#DEDCD7" stroke-width="2"/>
  <text x="120" y="592" font-family="'Noto Sans TC',sans-serif" font-size="32" font-weight="700" fill="#16191D">三房是主流，但新案正在往小坪數走</text>
  <g font-family="'IBM Plex Mono',monospace" font-size="21" fill="#737A83">
    <text x="120" y="644">2010 年代完工：4 房 29%　2 房 11%</text>
    <text x="120" y="684">2020 年後完工：4 房 <tspan fill="#B85400" font-weight="700">9%</tspan>　　2 房 <tspan fill="#B85400" font-weight="700">35%</tspan></text>
  </g>
  <path d="M120 716 H1080" stroke="#DEDCD7" stroke-width="2"/>
  <text x="120" y="764" font-family="'IBM Plex Mono',monospace" font-size="20" fill="#737A83">坪數越大單價越低：一房 34.9 → 四房 31.3 萬／坪</text>
</svg>
