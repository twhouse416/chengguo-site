  <g>
    <rect x="140" y="420" width="150" height="54"  fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>
    <rect x="320" y="334" width="150" height="140" fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>
    <rect x="500" y="312" width="150" height="162" fill="#FD7305" fill-opacity="0.85"/>
    <rect x="680" y="372" width="150" height="102" fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>
    <rect x="860" y="470" width="150" height="4"   fill="#16191D" fill-opacity="0.12" stroke="#16191D" stroke-width="2"/>

    <text x="215" y="402" font-family="'IBM Plex Mono',monospace" font-size="24" fill="#16191D" text-anchor="middle">24</text>
    <text x="395" y="316" font-family="'IBM Plex Mono',monospace" font-size="24" fill="#16191D" text-anchor="middle">70</text>
    <text x="575" y="294" font-family="'IBM Plex Mono',monospace" font-size="26" font-weight="700" fill="#B85400" text-anchor="middle">81</text>
    <text x="755" y="354" font-family="'IBM Plex Mono',monospace" font-size="24" fill="#16191D" text-anchor="middle">51</text>
    <text x="935" y="452" font-family="'IBM Plex Mono',monospace" font-size="24" fill="#16191D" text-anchor="middle">1</text>
  </g>
  <path d="M120 474 H1060" stroke="#16191D" stroke-width="2"/>
  <g font-family="'IBM Plex Mono',monospace" font-size="20" fill="#737A83" text-anchor="middle">
    <text x="215" y="512">&lt; 25%</text>
    <text x="395" y="512">25–30%</text>
    <text x="575" y="512">30–35%</text>
    <text x="755" y="512">35–40%</text>
    <text x="935" y="512">40%+</text>
