<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F4F4F2"/>
  <text x="120" y="100" font-family="'IBM Plex Mono',monospace" font-size="23" fill="#737A83">履約保證</text>
  <text x="120" y="168" font-family="'Noto Sans TC',sans-serif" font-size="52" font-weight="700" fill="#16191D">保的是價金交換，<tspan fill="#B85400">不是房子本身</tspan></text>
  <text x="120" y="256" font-family="'IBM Plex Mono',monospace" font-size="24" fill="#FD7305">它擋掉的</text>
  <path d="M124 304 l10 12 l20 -24" fill="none" stroke="#FD7305" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="172" y="318" font-family="'Noto Sans TC',sans-serif" font-size="28" fill="#16191D">賣方貸款沒清掉</text>
  <path d="M124 366 l10 12 l20 -24" fill="none" stroke="#FD7305" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="172" y="380" font-family="'Noto Sans TC',sans-serif" font-size="28" fill="#16191D">一屋二賣、查封</text>
  <path d="M124 428 l10 12 l20 -24" fill="none" stroke="#FD7305" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="172" y="442" font-family="'Noto Sans TC',sans-serif" font-size="28" fill="#16191D">過戶後收不到尾款</text>
  <line x1="620" y1="230" x2="620" y2="560" stroke="#D8D6D1" stroke-width="2"/>
  <text x="672" y="256" font-family="'IBM Plex Mono',monospace" font-size="24" fill="#737A83">它不管的</text>
  <path d="M676 296 l22 22 M698 296 l-22 22" fill="none" stroke="#737A83" stroke-width="4" stroke-linecap="round"/>
  <text x="724" y="318" font-family="'Noto Sans TC',sans-serif" font-size="28" fill="#737A83">交屋後發現漏水</text>
  <path d="M676 358 l22 22 M698 358 l-22 22" fill="none" stroke="#737A83" stroke-width="4" stroke-linecap="round"/>
  <text x="724" y="380" font-family="'Noto Sans TC',sans-serif" font-size="28" fill="#737A83">房價漲跌</text>
  <path d="M676 420 l22 22 M698 420 l-22 22" fill="none" stroke="#737A83" stroke-width="4" stroke-linecap="round"/>
  <text x="724" y="442" font-family="'Noto Sans TC',sans-serif" font-size="28" fill="#737A83">貸款成數不足</text>
  <path d="M676 482 l22 22 M698 482 l-22 22" fill="none" stroke="#737A83" stroke-width="4" stroke-linecap="round"/>
  <text x="724" y="504" font-family="'Noto Sans TC',sans-serif" font-size="28" fill="#737A83">一方反悔違約</text>
  <text x="120" y="648" font-family="'Noto Sans TC',sans-serif" font-size="27" font-weight="700" fill="#16191D">應記載事項裡沒有這一項——它是法規之外的機制</text>
  <text x="120" y="736" font-family="'IBM Plex Mono',monospace" font-size="21" fill="#737A83">法規規定的是價金撥付方式與原設定抵押權的處理</text>

</svg>
