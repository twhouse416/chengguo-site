<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F4F4F2"/>
  <text x="120" y="84" font-family="'IBM Plex Mono',monospace" font-size="21" fill="#737A83">換屋買方：先買後賣的新屋算第 2 戶　成數上限 7 成、不得有寬限期</text>

  <text x="120" y="150" font-family="'Noto Sans TC',sans-serif" font-size="27" font-weight="700" fill="#16191D">一張切結書，頭期款差 167 萬</text>
  <g>
    <rect x="300" y="186" width="470" height="48" fill="#16191D" fill-opacity="0.14" stroke="#16191D" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="300" y="252" width="313" height="48" fill="#B85400" fill-opacity="0.9"/>
    <g font-family="'IBM Plex Mono',monospace" font-size="20" fill="#16191D">
      <text x="120" y="216">未切結</text><text x="790" y="216" font-weight="700">頭期 500.4 萬（貸 7 成）</text>
      <text x="120" y="282">有切結</text><text x="633" y="282" font-weight="700" fill="#B85400">頭期 333.6 萬（貸 8 成）</text>
    </g>
  </g>
  <text x="120" y="334" font-family="'IBM Plex Mono',monospace" font-size="18" fill="#737A83">切結：第 2 戶貸款撥款日起 18 個月內售出原屋、完成移轉登記、清償原貸款並塗銷抵押權</text>
  <text x="120" y="362" font-family="'IBM Plex Mono',monospace" font-size="18" fill="#737A83">做到的話不受成數上限，也可以有寬限期　（以 1,668 萬的三房計算）</text>

  <path d="M120 398 H1080" stroke="#DEDCD7" stroke-width="2"/>

  <text x="120" y="450" font-family="'Noto Sans TC',sans-serif" font-size="27" font-weight="700" fill="#16191D">三個時鐘同時在跑，起算點都不一樣</text>
  <g font-family="'IBM Plex Mono',monospace" font-size="20" fill="#16191D">
    <text x="120" y="498"><tspan font-weight="700">18 個月</tspan>　切結出售　　自第 2 戶貸款<tspan fill="#B85400">撥款日</tspan>起算　　管成數與寬限期</text>
    <text x="120" y="540"><tspan font-weight="700">2 年　　</tspan>　重購退稅　　新舊屋<tspan fill="#B85400">移轉登記日</tspan>的間隔　管房地合一稅能不能退</text>
    <text x="120" y="582"><tspan font-weight="700">6 年　　</tspan>　自住優惠　　舊屋<tspan fill="#B85400">設籍並居住</tspan>起算　　管 400 萬免稅額與 10%</text>
  </g>

  <path d="M120 622 H1080" stroke="#DEDCD7" stroke-width="2"/>
  <text x="120" y="676" font-family="'Noto Sans TC',sans-serif" font-size="30" font-weight="700" fill="#16191D">換屋的缺口，比屋主想的大</text>
  <g font-family="'IBM Plex Mono',monospace" font-size="21" fill="#737A83">
    <text x="120" y="724">2 房 933 萬 → 3 房 1,668 萬　差 <tspan fill="#B85400" font-weight="700">735 萬</tspan>　｜　3 房 → 4 房 2,500 萬　差 <tspan fill="#B85400" font-weight="700">832 萬</tspan></text>
    <text x="120" y="760">本站 12,066 筆住家成交的總價中位數　｜　這還沒算仲介費、稅與規費</text>
  </g>
  <path d="M120 780 H1080" stroke="#DEDCD7" stroke-width="2"/>
</svg>
